function Heartbeat({active,boost}){
  const svgRef=useRef(null);const animRef=useRef(null);const phaseRef=useRef(0);
  useEffect(()=>{
    const el=svgRef.current;if(!el)return;
    if(isMobileOptimised()||prefersReducedMotion()){
      el.setAttribute('points','0,14 36,14 42,10 48,18 54,12 60,14 100,14');
      return()=>{if(animRef.current)cancelAnimationFrame(animRef.current)};
    }
    const w=100,h=28,mid=h/2;
    const cycles={base:2800,tick:1200,wait1:850,wait6:480};
    function frame(){
      const now=Date.now();
      const mode=boost&&boost.until>now?boost.mode:'base';
      const cycleMs=cycles[mode]||cycles.base;
      let phase=phaseRef.current;
      const pts=[];
      for(let x=0;x<=w;x++){
        const lx=((x/w)*4+phase)%4;let y=mid;
        if(lx>=1.56&&lx<1.78)y=mid+6;
        else if(lx>=1.78&&lx<1.96)y=mid-11;
        else if(lx>=1.96&&lx<2.14)y=mid+4;
        else if(lx>=2.14&&lx<2.34)y=mid-2;
        else y=mid+Math.sin(lx*Math.PI*0.25)*0.35;
        pts.push(x+','+y);
      }
      el.setAttribute('points',pts.join(' '));
      phase+=4/(cycleMs/16.67);if(phase>4)phase-=4;
      phaseRef.current=phase;
      animRef.current=requestAnimationFrame(frame);
    }
    animRef.current=requestAnimationFrame(frame);
    return()=>{if(animRef.current)cancelAnimationFrame(animRef.current)};
  },[active,boost]);
  const mode=boost&&boost.until>Date.now()?boost.mode:'base';
  const pace=mode==='wait6'?'+6h':mode==='wait1'?'+1h':mode==='tick'?'tick':'std';
  const accent=active?'#22d3ee':mode==='wait6'?'#f97316':mode==='wait1'?'#f59e0b':'#10b981';
  return(
    <div style={{display:'flex',alignItems:'center',width:125,height:28,minWidth:125,position:'relative',border:`1px solid ${active?'rgba(34,211,238,0.5)':mode==='wait6'?'rgba(249,115,22,0.45)':mode==='wait1'?'rgba(245,158,11,0.45)':'rgba(16,185,129,0.4)'}`,borderRadius:8,background:active?'rgba(34,211,238,0.06)':mode==='wait6'?'rgba(249,115,22,0.08)':mode==='wait1'?'rgba(245,158,11,0.08)':'rgba(16,185,129,0.06)',overflow:'hidden',flexShrink:0}}>
      <svg viewBox="0 0 100 28" preserveAspectRatio="none" style={{display:'block',width:'100%',height:'100%'}}>
        <polyline ref={svgRef} points="0,14 100,14" fill="none" stroke={accent} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 5px ${accent})`}}/>
      </svg>
      <span style={{position:'absolute',right:5,bottom:2,fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:accent,lineHeight:1}}>{pace}</span>
    </div>
  );
}

          const src='/observatory.html?session='+encodeURIComponent(sessionId)+(worldId?'&world='+encodeURIComponent(worldId):'')+'&embedded=1&v=portal-entry-compact-20260525a';

      });
    }).catch(()=>{});
    if(worldId)fetch(API+'/worlds/'+worldId).then(r=>r.json()).then(d=>{if(d.world?.displayLanguage)setDisplayLang(d.world.displayLanguage);const w=d.world;if(w){const dialect=(w.culture?.dialect||'').toLowerCase();const geo=(w.geography?.region||w.geography?.country||'').toLowerCase();const nonEng=!!(dialect&&!/english/i.test(dialect))||!!(geo&&!/\b(us|usa|uk|britain|england|america|australia|canada)\b/i.test(geo));setHasNonEnglish(nonEng||!!w.displayLanguage)}}).catch(()=>{});
  },[]);
  useEffect(()=>{
    if(!hasLlmSelection(modelGroups,llm))return;
    const [provider,...rest]=String(llm).split('|');
    persistLlmSelection(provider,rest.join('|'));
  },[llm,modelGroups]);
  const sendLLM=useCallback((value=llm)=>{
    const [provider,...rest]=String(value).split('|');
    frameRef.current?.contentWindow?.postMessage({type:'worldgen:set-llm',provider,model:rest.join('|')},window.location.origin);
  },[llm]);
  useEffect(()=>{sendLLM()},[sendLLM]);
  useEffect(()=>{
    const onMessage=event=>{
      if(event.origin!==window.location.origin)return;
      if(headerSelectOpenRef.current)return;
      if(event.data?.type==='worldgen:session-status')setStatus(event.data.status);
      if(event.data?.type==='worldgen:session-forbidden'){
        if(onForbidden){onForbidden(event.data);return}
        try{sessionStorage.setItem('worldgen:openCharacters','1')}catch(_){}
        window.history.replaceState(null,'','/index.html');
        window.location.reload();
        return;
      }
      if(event.data?.type==='worldgen:tick'){
        setTickActive(event.data.active);
      }
      if(event.data?.type==='worldgen:heartbeat'){
        const at=event.data.at||Date.now();
        const duration=event.data.duration||0;
        setHeartbeatBoost({mode:event.data.mode||'base',until:at+duration});
      }
      if(event.data?.type==='worldgen:mute-state'){setAudioMuted(event.data.muted)}
    };
    window.addEventListener('message',onMessage);
    return()=>window.removeEventListener('message',onMessage);
  },[]);
  const onLLMChange=e=>{const value=e.target.value;setLlm(value);const [provider,...rest]=String(value).split('|');persistLlmSelection(provider,rest.join('|'));sendLLM(value)};
  const LANG_OPTIONS=['','English','Spanish','French','German','Portuguese','Italian','Japanese','Chinese','Korean','Russian','Arabic'];
  const onLangChange=e=>{const v=e.target.value;setDisplayLang(v);fetch(API+'/worlds/'+worldId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayLanguage:v})}).catch(()=>{});frameRef.current?.contentWindow?.postMessage({type:'worldgen:set-lang',lang:v},window.location.origin)};
  const headerSelectProps={onFocus:()=>{headerSelectOpenRef.current=true},onMouseDown:()=>{headerSelectOpenRef.current=true},onBlur:()=>{setTimeout(()=>{headerSelectOpenRef.current=false},120)}};
  const sendCmd=(action,extra)=>{
    const win=frameRef.current?.contentWindow;
    if(!win)return;
    try{win.AudioManager?.unlock?.()}catch(e){}
    try{win.AudioManager?.unmute?.()}catch(e){}
    try{win.AudioManager?.play?.('ui.buttons')}catch(e){}
    win.postMessage({type:'worldgen:command',action,...(extra||{})},window.location.origin);
  };
  const navItems=[{id:'world',icon:'🌍'},{id:'community',icon:'👥'},{id:'street',icon:'🚶'}];
  const pop=status?.popularity??0;
  const popCol=pop>=70?'#22c55e':pop>=40?'#f59e0b':'#ef4444';
  const displayConcept=worldSelectorName({concept:status?.concept});
  const nightmareConcept=isFreddyConcept(status?.concept);
  const conceptBaseStyle=nightmareConcept
    ? {color:'#ef4444',textShadow:'0 0 5px #000, 0 0 10px rgba(239,68,68,.95), 0 0 18px rgba(250,204,21,.72)',fontWeight:900,background:'linear-gradient(90deg,rgba(0,0,0,.92),rgba(127,29,29,.58),rgba(0,0,0,.92))',border:'1px solid rgba(250,204,21,.55)',boxShadow:'0 0 16px rgba(239,68,68,.32), inset 0 0 10px rgba(0,0,0,.65)',borderRadius:4,padding:'2px 6px'}
    : {color:'#fde047',textShadow:'0 0 8px #facc15, 0 0 18px rgba(250,204,21,.85), 0 0 28px rgba(250,204,21,.55)',fontWeight:700};
  const conceptWords=(displayConcept||'').split(' ');
  const conceptHalf=Math.ceil(conceptWords.length/2);
  const conceptLine1=conceptWords.slice(0,conceptHalf).join(' ');
  const conceptLine2=conceptWords.slice(conceptHalf).join(' ');
  const conceptIsLong=conceptWords.length>3;

  // [HEADER-EQUAL-GAPS] DOM-level !important forcing — beats every CSS rule including

  // body.wg-mobile-optimised compound selectors. Runs after every render so layout shifts

  // (LLM swap, world swap, mute toggle) get reapplied.

  useEffect(()=>{

    const root=document.querySelector('.wg-observatory-top');

    if(!root)return;

    root.style.setProperty('display','flex','important');

    root.style.setProperty('grid-template-columns','none','important');

    root.style.setProperty('align-items','center','important');

    const status=root.querySelector('.wg-observatory-status');

    if(status){

      status.style.setProperty('margin-left','0','important');

      status.style.setProperty('margin-right','0','important');
      status.style.setProperty('padding','0 24px','important');

      status.style.setProperty('flex','0 0 auto','important');

      status.style.setProperty('width','auto','important');

    }

    const left=root.querySelector('.wg-observatory-left');

    if(left){

      left.style.setProperty('flex','1 1 0','important');
      left.style.setProperty('justify-content','space-between','important');

      left.style.setProperty('width','auto','important');

    }

    const actions=root.querySelector('.wg-observatory-actions');

    if(actions){

      actions.style.setProperty('flex','1 1 0','important');
      actions.style.setProperty('width','auto','important');
      actions.style.setProperty('justify-content','space-between','important');
    }

  });

  return(
    <div className="wg-observatory-shell">
      <div className="wg-observatory-top" style={{display:'flex',gridTemplateColumns:'none',alignItems:'center'}}>
        <div className="wg-observatory-left" style={{paddingLeft:10,width:'auto',flex:'0 0 auto'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <select className="wg-model-select" style={{width:148,fontSize:11,padding:'4px 6px'}} value={llm} onChange={onLLMChange} {...headerSelectProps}>
              {modelGroups.flatMap(p=>p.models.map(m=><option key={p.id+'|'+m} value={p.id+'|'+m}>{p.label} - {m}</option>))}
            </select>
            {hasNonEnglish&&<select className="wg-model-select" style={{width:148,fontSize:11,padding:'4px 6px'}} value={displayLang} onChange={onLangChange} title="Display language for dialogue and narration" {...headerSelectProps}>
              {LANG_OPTIONS.map(l=><option key={l} value={l}>{l||'Native'}</option>)}
            </select>}
          </div>
          {navItems.map(v=><button key={v.id} className={'wg-hdr-btn'+(status?.view===v.id?' active':'')} onClick={()=>sendCmd('nav',{view:v.id})} title={v.id}>{v.icon}</button>)}
          <div className="wg-subbar-orbit" onClick={()=>sendCmd('nav',{view:'portal'})} style={{cursor:'pointer'}} title="Open portal"><span className="ring"/><span className="ring two"/><span className="core"/><span className="spark"/></div>
        </div>
        <div className="wg-observatory-status" style={{marginLeft:'auto',marginRight:'auto',flex:'0 0 auto',width:'auto',minWidth:0}}>
          <div className="wg-observatory-title-unit">
            <div className="wg-logo" onClick={onExit} style={{fontSize:54,gap:8,display:'flex',alignItems:'center',flexShrink:0}}><span style={{fontSize:48,lineHeight:1}}>🜂</span>World<span style={{fontSize:'0.75em',color:'#facc15',marginLeft:-6,textShadow:'0 0 10px rgba(250,204,21,.45)'}}>Gen</span></div>
            {displayConcept&&(conceptIsLong
              ?<span className="wg-observatory-concept" style={{...conceptBaseStyle,fontSize:24,display:'flex',flexDirection:'column',lineHeight:1.15,whiteSpace:'nowrap'}}>
                <span>{conceptLine1}</span>
                <span style={{paddingLeft:'2em'}}>{conceptLine2}</span>
              </span>
              :<span className="wg-observatory-concept" style={{...conceptBaseStyle,fontSize:24}}>{displayConcept}</span>)}
          </div>
        </div>
        <div className="wg-observatory-actions" style={{width:'auto',flex:'0 0 auto'}}>
          <span className="wg-observatory-right-heartbeat"><Heartbeat active={tickActive} boost={heartbeatBoost}/></span>
          <button className="wg-hdr-btn" onClick={()=>sendCmd('tick')} title="Tick" style={{color:'#10b981',borderColor:'rgba(16,185,129,0.33)'}}>✅</button>
          <button className="wg-hdr-btn" onClick={()=>sendCmd('wait',{hours:1})} title="+1 hour" style={{color:'#f59e0b',borderColor:'rgba(245,158,11,0.27)',fontSize:11,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>+1h</button>
          <button className="wg-hdr-btn" onClick={()=>sendCmd('wait',{hours:6})} title="+6 hours" style={{color:'#f59e0b',borderColor:'rgba(245,158,11,0.27)',fontSize:11,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>+6h</button>
          <div style={{display:'flex',alignItems:'baseline',gap:1,padding:'0 6px',borderLeft:'1px solid #252530'}} title="Population popularity">
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:22,fontWeight:700,color:popCol}}>{pop}</span>
            <span style={{fontSize:11,color:popCol}}>%</span>
          </div>
          <button className="wg-hdr-btn" title={audioMuted?'Unmute ambient':'Mute ambient'} aria-label={audioMuted?'Unmute ambient sounds':'Mute ambient sounds'} onClick={()=>sendCmd('toggle-mute')} style={{color:audioMuted?'#ef4444':'#10b981',borderColor:audioMuted?'rgba(239,68,68,0.33)':'rgba(16,185,129,0.33)'}}>{audioMuted?'🔇':'🎵'}</button>
        </div>
      </div>
      <iframe ref={frameRef} className="wg-observatory-frame" src={src} title="WorldGen Observatory" allow="autoplay" onLoad={()=>sendLLM()}/>
    </div>
  );
}

function SoundPackPanel({worldId}){
  const[info,setInfo]=useState(null);
  const[infoErr,setInfoErr]=useState('');
  const[run,setRun]=useState(null);
  const[p1,setP1]=useState(false);
  const[p2,setP2]=useState(false);
  const[p3,setP3]=useState(true);
  const[error,setError]=useState('');
  const[busy,setBusy]=useState(false);
  const[showLog,setShowLog]=useState(false);
  const loadInfo=useCallback(async()=>{
    try{
      const r=await fetch(API+'/worlds/'+worldId+'/pack');
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||('Server error '+r.status));
      setInfo(d);
      setInfoErr('');
    }catch(e){setInfoErr(e.message||String(e))}
  },[worldId]);
  const pollStatus=useCallback(async()=>{
    try{
      const r=await fetch(API+'/pack-builder/status');
      const d=await r.json().catch(()=>({}));
      setRun(d.run||null);
    }catch{}
  },[]);
  useEffect(()=>{loadInfo();pollStatus();},[loadInfo,pollStatus]);
  useEffect(()=>{const t=setInterval(pollStatus,run?.running?3000:10000);return()=>clearInterval(t);},[pollStatus,run?.running]);
  useEffect(()=>{if(run&&!run.running)loadInfo();},[loadInfo,run?.running,run?.endedAt]);
  const doRun=async()=>{
    const phases=[];
    if(p1)phases.push(1);
    if(p2)phases.push(2);
    if(p3)phases.push(3);
    if(!phases.length){setError('Pick at least one phase.');return}
    setBusy(true);setError('');
    try{
      const pack=info?.packs?.[0]?.dir;
      const body={phases,worldId};
      if(pack)body.pack=pack;
      const r=await fetch(API+'/pack-builder/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||('Server error '+r.status));
      setRun(d.run);
    }catch(e){setError(e.message||String(e))}
    finally{setBusy(false)}
  };
  const packs=info?.packs||[];
  const pack=packs[0]||null;
  const running=!!run?.running;
  const isOurRun=running&&run.worldId===worldId;
  const sourceColor=(pack?.themesSource==='llm'||pack?.themesSource==='manual')?'#7dd3fc':pack?.themesSource==='bank-fallback'?'#fbbf24':'#94a3b8';
  return(
    <div className="wg-detail-card wg-detail-card-wide" style={{marginTop:18}}>
      <h3>Sound Pack</h3>
      {infoErr&&<div className="wg-error-box" style={{marginBottom:8,fontSize:12}}>{infoErr}</div>}
      {!pack&&!infoErr&&<div className="wg-muted" style={{fontSize:13,marginBottom:8}}>No sound pack bound to this world yet. Run Phase 1 to create one.</div>}
      {pack&&(
        <div style={{display:'flex',flexWrap:'wrap',gap:14,alignItems:'center',fontSize:13,marginBottom:10}}>
          <div><span className="wg-muted">Pack:</span> <strong>{pack.name}</strong></div>
          <div><span className="wg-muted">Audio:</span> <strong>{pack.audioCount}</strong> files</div>
          <div><span className="wg-muted">Themes:</span> <strong>{pack.themeCount}</strong></div>
          <div><span className="wg-muted">Source:</span> <strong style={{color:sourceColor}}>{pack.themesSource}</strong></div>
        </div>
      )}
      <div style={{display:'flex',flexWrap:'wrap',gap:10,fontSize:13,marginBottom:8}}>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
          <input type="checkbox" checked={p1} onChange={e=>setP1(e.target.checked)} disabled={running}/>
          <span>P1: Build new pack</span>
        </label>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
          <input type="checkbox" checked={p2} onChange={e=>setP2(e.target.checked)} disabled={running}/>
          <span>P2: Enhance bland themes (LLM)</span>
        </label>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
          <input type="checkbox" checked={p3} onChange={e=>setP3(e.target.checked)} disabled={running}/>
          <span>P3: Fetch missing audio</span>
        </label>
      </div>
      <div className="wg-modal-actions" style={{justifyContent:'flex-start',gap:10,marginTop:6}}>
        <button className="wg-btn wg-btn-primary" onClick={doRun} disabled={busy||running}>{running?(isOurRun?'Running...':'Builder busy'):busy?'Starting...':'Run pipeline'}</button>
        <button className="wg-btn" onClick={loadInfo} disabled={busy}>Refresh</button>
        {run&&<button className="wg-btn" onClick={()=>setShowLog(s=>!s)}>{showLog?'Hide log':'Show log'}</button>}
      </div>
      {error&&<div className="wg-error-box" style={{marginTop:8,fontSize:12}}>{error}</div>}
      {run&&(
        <div className="wg-muted" style={{fontSize:12,marginTop:8}}>
          {run.running?'Running ':'Last run '}
          phases={(run.phases||[]).join(',')||'?'}
          {run.pack?' pack='+run.pack:''}
          {' started='+new Date(run.startedAt).toLocaleTimeString()}
          {run.endedAt?' ended='+new Date(run.endedAt).toLocaleTimeString():''}
          {typeof run.code==='number'?' exit='+run.code:''}
        </div>
      )}
      {showLog&&run&&(
        <pre style={{marginTop:8,maxHeight:220,overflow:'auto',background:'#0d1117',color:'#c9d1d9',padding:8,fontSize:11,lineHeight:1.4,borderRadius:4,border:'1px solid #1f2937'}}>
{(run.stdoutTail||'(no stdout yet)')+(run.stderrTail?('\n--- stderr ---\n'+run.stderrTail):'')}
        </pre>
      )}
    </div>
  );
}

function WorldDetail({worldId,onBack,activePlayer,onRequireSignIn}){
  const[world,setWorld]=useState(null);const[loading,setLoading]=useState(true);
  const[loadError,setLoadError]=useState('');
  const[entering,setEntering]=useState(false);
  // Keep loadWorld in a ref so portrait-editor callbacks can call it without re-running the effect.
  const loadWorldRef=React.useRef(null);
  useEffect(()=>{
    window.scrollTo(0,0);
    let alive=true;
    let currentController=null;
    const fetchOnce=(showSpinner)=>{
      if(currentController)currentController.abort();
      const controller=new AbortController();currentController=controller;
      const timer=setTimeout(()=>controller.abort(),15000);
      if(showSpinner){setLoading(true);setLoadError('');setWorld(null)}
      return fetch(API+'/worlds/'+worldId+'?_t='+Date.now(),{signal:controller.signal,cache:'no-store'})
        .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Server error '+r.status));return d})
        .then(d=>{if(alive)setWorld(d.world||null)})
        .catch(e=>{if(alive&&showSpinner)setLoadError(e.name==='AbortError'?'World load timed out.':(e.message||String(e)))})
        .finally(()=>{clearTimeout(timer);if(alive&&showSpinner)setLoading(false)});
    };
    loadWorldRef.current=()=>fetchOnce(false);
    fetchOnce(true);
    return()=>{alive=false;if(currentController)currentController.abort();loadWorldRef.current=null};
  },[worldId]);
  const reloadWorld=()=>{ if(loadWorldRef.current)loadWorldRef.current() };
  const enterWorld=async()=>{
    if(!activePlayer?.id||!activePlayer?.pin){onRequireSignIn?.();return}
    setEntering(true);
    try{
      const res=await fetch(API+'/worlds/'+worldId+'/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({globalPlayerId:activePlayer.id,pin:activePlayer.pin})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||('Server error '+res.status));
      window.location.href='/index.html?session='+encodeURIComponent(data.session.id)+'&world='+encodeURIComponent(worldId);
    }catch(e){alert(e.message||String(e))}
    finally{setEntering(false)}
  };
  if(loading)return<div style={{textAlign:'center',padding:80}}><div className="wg-spinner"/></div>;
  if(!world)return<div className="wg-empty"><div style={{fontSize:18,marginBottom:12}}>World not loaded</div>{loadError&&<div className="wg-error-box" style={{maxWidth:520,margin:'0 auto 16px'}}>{loadError}</div>}<button className="wg-btn" onClick={onBack}>Back to worlds</button></div>;
  const photo=worldPhotoUrl(world);
  const worldLocations=world.locations||[];
  const worldNpcs=world.npcs||[];
  const topCast=(world.images&&world.images.castPortraits)||[];
  const displayName=worldSelectorName(world);
  return(<div className="wg-world-detail" style={worldDetailStyle(world,photo)}>
    {photo&&<img className="wg-detail-hero" src={photo} alt="" onError={e=>{e.currentTarget.src=IMG_PLACEHOLDER;e.currentTarget.classList.add('img-dim')}}/>}
    <div className="wg-detail-header">
      <button className="wg-detail-back" onClick={onBack}>{'\ud83d\udc48'}</button>
      <div className="wg-detail-info">
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
          <button className="wg-enter-orb" type="button" onClick={enterWorld} disabled={entering} title={entering?'Entering world...':'Enter world'} aria-label={entering?'Entering world':'Enter world'}>
            <span className="ring"/><span className="ring two"/><span className="core"/><span className="spark"/>
          </button>
        </div>
        <h1>{displayName}</h1>
      </div>
    </div>
    {(worldNpcs.length>0||topCast.length>0)&&(<div className="wg-cast-section"><h3 className="wg-cast-title">Cast</h3><button type="button" title="Match real actor portraits for this world's cast" aria-label="Match real actor portraits" onClick={()=>window.ppRunForWorld&&window.ppRunForWorld(world.id)} style={{display:'block',width:16,height:16,padding:0,borderRadius:'50%',background:'#ef4444',border:'2px solid #fca5a5',cursor:'pointer',margin:'2px auto 12px',boxShadow:'0 0 10px rgba(239,68,68,.85)'}}/><div className="wg-cast-grid">{topCast.length>0?topCast.map((m,i)=><div key={(m.actor||'cast')+i} className="wg-cast-member"><div className="wg-cast-portrait"><img src={safeImageUrl(m.imageUrl)||IMG_PLACEHOLDER} alt="" onError={e=>{e.currentTarget.src=IMG_PLACEHOLDER}}/></div><div className="wg-cast-name">{m.actor||'Unknown'}</div><div className="wg-cast-role">{m.character||''}</div></div>):worldNpcs.map((npc,i)=>{const c=PAL[hc(npc.id||npc.name||i)%PAL.length].accent;return(<div key={npc.id||npc.name||i} className="wg-cast-member"><div className="wg-cast-portrait"><NpcAvatar npc={npc} world={world} color={c} size={72}/></div><div className="wg-cast-name">{npc.name||'Unnamed'}</div></div>)})}</div></div>)}
    <div className="wg-cast-section wg-locations-section"><h3 className="wg-cast-title">Locations</h3><div className="wg-detail-card wg-detail-card-full wg-locations-standalone"><div className="wg-compact-list">{worldLocations.map((loc,i)=><LocationCard key={loc.id||loc.name||i} loc={loc} world={world}/>)}</div></div></div>
    <div className="wg-detail-grid">
      <div className="wg-detail-card wg-detail-card-wide" style={{maxHeight:'240px',overflowY:'auto'}}><h3>Culture</h3><div className="wg-section-stack"><DetailSection title="Core"><RecordGrid entries={[['Language',world.culture?.language],['Dialect',world.culture?.dialect],['Religion',world.culture?.religion],['Music',world.culture?.music],['Gender roles',world.culture?.genderRoles]]}/></DetailSection><DetailSection title="Everyday speech"><DenseList items={world.culture?.greetings} empty="No common greetings recorded."/></DetailSection><DetailSection title="Food"><DenseList items={world.culture?.food} empty="No staple foods recorded."/></DetailSection><DetailSection title="Norms"><DenseList items={world.culture?.socialNorms} empty="No social norms recorded."/></DetailSection></div></div>
      <div className="wg-detail-card" style={{maxHeight:'240px',overflowY:'auto'}}><h3>Slang</h3><DataRows rows={Object.entries(world.culture?.slang||{}).slice(0,12)}/>{!(Object.keys(world.culture?.slang||{}).length)&&<div className="wg-muted" style={{fontSize:13}}>No local slang captured.</div>}</div>
      <div className="wg-detail-card wg-detail-card-wide wg-panel-bg-card" style={worldPanelBgStyle(world,'economy')}><h3>Economy</h3><div className="wg-section-stack"><DetailSection title="Overview"><RecordGrid entries={[['Currency',world.economy?.currency?.name||world.economy?.currency],['Symbol',world.economy?.currency?.symbol||world.economy?.symbol],['Daily wage',world.economy?.averageDailyWage&&money(world,world.economy.averageDailyWage)],['Black market',world.economy?.blackMarket]]}/></DetailSection><DetailSection title="Common jobs"><div className="wg-job-grid">{world.economy?.jobs?.slice(0,6).map(j=><div className="wg-job-card" key={j.title}><div className="wg-job-head"><strong>{j.title}</strong><span className="wg-muted">{j.hours}</span></div><div className="wg-job-pay">{j.pay!==undefined?money(world,j.pay):'Unpriced'} <span className="wg-muted">· {j.socialClass}</span></div><div className="wg-muted">{j.description}</div></div>)}</div></DetailSection><DetailSection title="Typical prices"><RecordGrid entries={Object.entries(world.economy?.prices||{}).slice(0,10)} renderValue={(value)=>money(world,value)}/></DetailSection></div></div>

function WorldSelectorWarning({issues,onOpenTools}){
  const [open,setOpen]=useState(false);
  const popRef=useRef(null);
  const items=Array.isArray(issues)?issues:[];
  const errors=items.filter(i=>i?.level==='error');
  const warnings=items.filter(i=>i?.level!=='error');
  useEffect(()=>{
    if(!open)return;
    const onClick=(e)=>{if(popRef.current&&!popRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',onClick);
    return()=>document.removeEventListener('mousedown',onClick);
  },[open]);
  if(items.length===0)return null;
  const count=errors.length||items.length;
  const title=errors.length?`${errors.length} world selector blocker${errors.length===1?'':'s'}`:`${warnings.length} world selector warning${warnings.length===1?'':'s'}`;
  return(<div style={{position:'relative'}} ref={popRef}>
    <button className={'wg-orch-pill '+(errors.length?'wg-orch-error':'wg-orch-queue')} onClick={()=>setOpen(o=>!o)} title={title} aria-label={title}>
      <span className="wg-orch-dot"/>⚠ <strong>{count}</strong>
    </button>
    {open&&<div className="wg-orch-pop">
      <div className="wg-orch-head"><h3>World Selector</h3><span className="wg-orch-pop-wid">{errors.length?'blocked':'warnings'}</span></div>
      {errors.length>0&&<div className="wg-error-box" style={{marginBottom:10}}><strong>{errors.length} world file(s) are not showing.</strong><br/>Fix or refresh these before trusting the selector.</div>}
      {items.slice(0,10).map((issue,i)=>(<div className={'wg-orch-act '+(issue.level==='error'?'error':'running')} key={'wi'+i}>
        <span className="wg-orch-act-icon">{issue.level==='error'?'✗':'⚠'}</span>
        <div className="wg-orch-act-body">
          <div className="wg-orch-act-name" title={issue.file||issue.worldId||issue.worldName}>{issue.worldName||issue.file||issue.worldId||'World data'}</div>
          <div className="wg-orch-act-kind">{issue.reason}{issue.detail?' · '+String(issue.detail).slice(0,90):''}</div>
        </div>
      </div>))}
      {items.length>10&&<div className="wg-build-note" style={{fontSize:11,marginTop:8}}>...and {items.length-10} more issue(s).</div>}
      <button className="wg-orch-toggle on" onClick={()=>{setOpen(false);onOpenTools&&onOpenTools();}}>Open integrity tools</button>
    </div>}
  </div>);
}
function App(){

  const signOutPlayer=()=>{clearActivePlayer();setActivePlayer(null);setActivePlayerPin('')};
  const deleteWorld=async(id)=>{if(!confirm('Delete this world and all its sessions?'))return;await fetch(API+'/worlds/'+id,{method:'DELETE'});fetchWorlds()};
  const selectWorld=id=>{setQuestManagerOpen(false);setSelectedWorld(id)};
  const totalNpcs=worlds.reduce((a,w)=>a+(w.npcCount||0),0);
  const totalLocs=worlds.reduce((a,w)=>a+(w.locationCount||0),0);
  if(sessionParam)return <ObservatorySession sessionId={sessionParam} worldId={worldParam} onExit={()=>{window.history.replaceState(null,'','/index.html');window.location.reload()}} onForbidden={()=>{window.history.replaceState(null,'','/index.html');setSelectedWorld(null);setAwardsOpen(true)}}/>;
  return(
    <div className="wg-app">
      <div className="wg-header">
        <div className="wg-logo" onClick={()=>{setQuestManagerOpen(false);setSelectedWorld(null)}}><div className="wg-logo-dot"/> WorldGen</div>
        <div className="wg-header-main">
          <div className="wg-header-search-actions">
            <button className="wg-btn wg-btn-header wg-active-player-btn wg-icon-header" title={activePlayer?.playerName||'Characters'} aria-label="Characters" onClick={()=>setAwardsOpen(true)}>👤</button>
            <button className="wg-btn wg-btn-header wg-icon-header" title="Create character" aria-label="Create character" onClick={()=>setCharOpen(true)}>➕</button>
            <button className="wg-btn wg-btn-header wg-icon-header" title="Quest Manager" aria-label="Quest Manager" onClick={()=>{setSelectedWorld(null);setQuestManagerOpen(open=>!open)}}>📜</button>
            <PlayerSearch onSelectWorld={selectWorld}/>
            <button className="wg-btn wg-btn-header wg-icon-header" title="Integrity scanner" aria-label="Integrity scanner" onClick={()=>{setCheckInitialView('menu');setCheckOpen(true)}}>📷</button>
            <button className="wg-btn wg-btn-header wg-icon-header" title="Build sound packs" aria-label="Build sound packs" onClick={()=>{setCheckInitialView('packBuilder');setCheckOpen(true)}}>🔊</button>
            <WorldSelectorWarning issues={worldIssues} onOpenTools={()=>{setCheckInitialView('menu');setCheckOpen(true)}}/>
            {incompleteCount>0&&<button className="wg-btn wg-btn-header wg-icon-header" title={showIncomplete?('Showing '+incompleteCount+' worlds with missing images. Click to hide them'):(incompleteCount+' worlds hidden because some images are missing. Click to show them')} aria-label="Toggle incomplete worlds" aria-pressed={showIncomplete} onClick={()=>{const next=!showIncompleteRef.current;showIncompleteRef.current=next;setShowIncomplete(next);fetchWorlds()}} style={{opacity:showIncomplete?1:.6}}>{'◐ '+incompleteCount}</button>}
            <button className="wg-btn wg-btn-header wg-icon-header" title="Build world" aria-label="Build world" onClick={()=>setBuildOpen(true)}>⚙️</button>
          </div>
          <div className="wg-header-stats">
            <div><span>{worlds.length}</span> worlds</div><div><span>{totalNpcs}</span> npcs</div><div><span>{totalLocs}</span> locations</div>
          </div>
        </div>
      </div>
      <div className="wg-content">
        {error&&<div style={{padding:'12px 16px',background:'rgba(239,68,68,0.1)',border:'1px solid var(--danger)',borderRadius:8,marginBottom:24,fontSize:14,color:'var(--danger)'}}>Cannot reach server: {error}</div>}
        <RenderGuard>{selectedWorld?(<WorldDetail worldId={selectedWorld} onBack={()=>setSelectedWorld(null)} activePlayer={activePlayer?{...activePlayer,pin:activePlayerPin}:null} onRequireSignIn={()=>setAwardsOpen(true)}/>):(
          <>
          {loading?(<div style={{textAlign:'center',padding:80}}><div className="wg-spinner"/></div>):worlds.length===0&&!error?(
            <div className="wg-empty"><div style={{fontSize:48,marginBottom:16,opacity:0.4}}>{'\u25CC'}</div><div style={{fontSize:18,marginBottom:8}}>No worlds yet</div><div style={{maxWidth:400,margin:'0 auto',lineHeight:1.6,fontSize:14}}>Create your first world - describe a concept and an AI provider will generate the geography, culture, NPCs, economy, and locations.</div><button className="wg-btn wg-btn-primary" style={{marginTop:24}} onClick={()=>setCreateOpen(true)}>Create Your First World</button></div>
          ):(questManagerOpen?<GlobalQuestBoard players={globalQuestPlayers} worlds={worlds} onSelectWorld={selectWorld} onRefresh={fetchWorlds} activePlayer={activePlayer?{...activePlayer,pin:activePlayerPin}:null} onRequireSignIn={()=>setAwardsOpen(true)} questManagerOpen={questManagerOpen} onQuestManagerOpenChange={setQuestManagerOpen}/>:<div className="wg-grid">{[...worlds].sort((a,b)=>(new Date(b.createdAt||0).getTime())-(new Date(a.createdAt||0).getTime())).map(w=>(<WorldTile key={w.id} world={w} palette={PAL[hc(w.id)%PAL.length]} questMarkers={questMarkers[w.id]||[]} onClick={()=>selectWorld(w.id)} onDelete={()=>deleteWorld(w.id)}/>))}<div className="wg-create-tile" onClick={()=>setCreateOpen(true)}><div className="wg-create-icon">+</div><div style={{fontSize:14,fontWeight:500}}>New World</div></div></div>)}</>
        )}</RenderGuard>
      </div>
      <CreateModal open={createOpen} onClose={()=>setCreateOpen(false)} onCreated={w=>{setCreateOpen(false);fetchWorlds();selectWorld(w.id)}}/>
      <RenderGuard><BuildWorldModal open={buildOpen} onClose={()=>setBuildOpen(false)} onCreated={w=>{setBuildOpen(false);fetchWorlds();selectWorld(w.id)}}/></RenderGuard>
      <CheckDataModal open={checkOpen} initialView={checkInitialView} onClose={()=>setCheckOpen(false)} onUpdated={fetchWorlds}/>
      <CharacterCreateModal open={charOpen} onClose={()=>setCharOpen(false)} onCreated={(player,pin)=>{signInPlayer(player,pin);fetchWorlds();fetchQuestMarkers()}}/>
      <CharacterAwardsModal open={awardsOpen} onClose={()=>setAwardsOpen(false)} activePlayer={activePlayer} onSignedIn={signInPlayer} onSignedOut={signOutPlayer} onCharacterCreated={()=>{fetchWorlds();fetchQuestMarkers()}}/>
    </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><script>
/* Mobile portrait interaction gate. Runs before React mounts and blocks every
   user action while the device is in portrait, force-applying the .wg-mobile-optimised
   class so the CSS "Only landscape" overlay shows even if the orientation change
   happened mid-interaction or before the React effect has run. */
(function(){
  function isMobileCandidate(){
    return window.matchMedia("(max-width:760px)").matches ||
      (window.matchMedia("(hover:none)").matches && window.matchMedia("(pointer:coarse)").matches);
  }
  function isPortrait(){
    return window.matchMedia("(orientation:portrait)").matches;
  }
  function ensureGate(){
    if(isMobileCandidate() && document.body){
      document.body.classList.add("wg-mobile-optimised");
    }
  }
  function blockIfPortrait(e){
    if(!isMobileCandidate() || !isPortrait()) return;
    try{ e.preventDefault(); }catch(_){}
    try{ e.stopPropagation(); }catch(_){}
    try{ if(e.stopImmediatePropagation) e.stopImmediatePropagation(); }catch(_){}
    ensureGate();
  }
  ensureGate();
  var evs = ["pointerdown","touchstart","mousedown","keydown","click","focusin"];
  for(var i=0;i<evs.length;i++){
    window.addEventListener(evs[i], blockIfPortrait, { capture:true, passive:false });
  }
  window.addEventListener("orientationchange", ensureGate);
  window.addEventListener("resize", ensureGate);
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", ensureGate);
  }
})();
</script>

<!-- ArcFace portrait pipeline — triggered by the red dot under the Cast title (window.ppRunForWorld) -->
<div id="pp-toast" style="position:fixed;bottom:14px;right:14px;z-index:99999;display:none;background:rgba(8,11,18,.96);border:1px solid rgba(239,68,68,.5);border-radius:10px;padding:10px 12px;max-width:380px;font-family:inherit;box-shadow:0 8px 30px rgba(0,0,0,.55)">
  <div style="font-size:11px;color:#fca5a5;font-weight:600;margin-bottom:4px">🎭 Matching real actor portraits…</div>
  <pre id="pp-toast-log" style="margin:0;max-height:150px;overflow:auto;font-size:9px;color:#94a3b8;white-space:pre-wrap"></pre>
</div>
<script>
(function(){
  var PP_API='/api';
  function ppHeaders(){
    var h={'Content-Type':'application/json'};
    try{ var p=JSON.parse(localStorage.getItem('worldgen:activePlayer')||'null'); if(p&&p.id&&p.pin){ h['x-global-player-id']=p.id; h['x-global-player-pin']=p.pin; } }catch(e){}
    return h;
  }
  function ppJson(url,opts){ return fetch(PP_API+url,opts).then(function(r){ return r.text().then(function(t){ var d=t?JSON.parse(t):{}; if(!r.ok){ var err=new Error(d.error||('HTTP '+r.status)); err.status=r.status; Object.assign(err,d); throw err; } return d; }); }); }
  function show(msg){ var t=document.getElementById('pp-toast'), l=document.getElementById('pp-toast-log'); if(t) t.style.display='block'; if(l) l.textContent=msg; }
  var _running=false;
  function poll(wid){
    ppJson('/worlds/'+encodeURIComponent(wid)+'/portrait-pipeline/status',{headers:ppHeaders()}).then(function(s){
      show((s.log||'').slice(-1600));
      if(s.running){ setTimeout(function(){poll(wid)},2000); return; }
      _running=false;
      if(s.error){ show((s.log||'').slice(-1100)+'\n\n⚠️ '+s.error); return; }
      var applied=(s.appliedNpcIds||[]).length, skipped=(s.result&&s.result.skippedSwaps)?s.result.skippedSwaps.length:0;
      show('✅ swapped '+applied+' / skipped '+skipped+'. Reloading…');
      setTimeout(function(){ window.location.reload(); }, 1400);
    }).catch(function(e){ show('Poll error: '+(e&&e.message||e)); _running=false; });
  }
  window.ppRunForWorld=function(worldId){
    if(!worldId){ alert('No world id'); return; }
    if(_running){ show('A portrait run is already in progress…'); return; }
    _running=true;
    show('Starting — matching as much of the cast as possible.\n(First run downloads the face model, ~280MB; give it a minute.)');
    // Prefer fewer, high-confidence swaps over broad low-confidence cast coverage.
    ppJson('/worlds/'+encodeURIComponent(worldId)+'/portrait-pipeline',{method:'POST',headers:ppHeaders(),body:JSON.stringify({minFacePx:420,thresh:.45,castPortraits:3})})
      .then(function(){ poll(worldId); })
      .catch(function(e){
        if(e&&e.status===409){ show('A run is already in progress — attaching…'); poll(worldId); return; }
        var extra=(e&&e.missing&&e.missing.length)?('\n[missing: '+e.missing.join(', ')+']'):'';
        var hint=(e&&e.hint)?('\n💡 '+e.hint):'';
        show('Error: '+(e&&e.message||e)+extra+hint); _running=false;
      });
  };
})();
</script>
