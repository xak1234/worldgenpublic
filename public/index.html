function NpcPortraitEditor({npc,world,onClose,onChanged}){
  const [busy,setBusy]=useState('');
  const [error,setError]=useState('');
  const [url,setUrl]=useState('');
  const [dragOver,setDragOver]=useState(false);
  const photo=npcPhotoUrl(npc,world);
  // Refs for the paste/drop listeners. We attach the listener ONCE (empty deps) and
  // read the latest values via the refs - this prevents stale-closure routing pastes
  // to a previous world/npc when the user switches contexts.
  const stateRef=React.useRef({busy:'',world,npc});
  stateRef.current={busy,world,npc};
  const submitFile=async(file,sourceLabel)=>{
    if(!file)return;
    const curWorld=stateRef.current.world;
    const curNpc=stateRef.current.npc;
    if(!curWorld?.id||!curNpc?.id){setError('Modal context lost - please reopen');return}
    if(file.size>12*1024*1024){setError('File too large (max 12MB)');return}
    if(!/^image\//.test(file.type||'')){setError('Not an image ('+(file.type||'unknown type')+')');return}
    setBusy((sourceLabel||'Uploading')+'…');setError('');
    try{
      const dataBase64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||'').split(',')[1]||'');r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(file)});
      const ext=(file.type||'').replace(/^image\//,'').split('+')[0]||'jpg';
      const filename=file.name||('pasted.'+ext);
      const r=await fetch(API+'/worlds/'+curWorld.id+'/npc/'+encodeURIComponent(curNpc.id)+'/portrait',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename,dataBase64})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||('Server '+r.status));
      onChanged&&onChanged();
    }catch(e){setError(e.message||String(e));setBusy('')}
  };
  const submitFileRef=React.useRef(submitFile);
  submitFileRef.current=submitFile;
  const submitUrl=async()=>{
    const curWorld=stateRef.current.world;
    const curNpc=stateRef.current.npc;
    const u=url.trim();
    if(!u){setError('Paste an image URL first');return}
    if(!/^https?:\/\//i.test(u)){setError('URL must start with http:// or https://');return}
    if(!curWorld?.id||!curNpc?.id){setError('Modal context lost - please reopen');return}
    setBusy('Fetching '+(new URL(u).hostname)+'…');setError('');
    try{
      const r=await fetch(API+'/worlds/'+curWorld.id+'/npc/'+encodeURIComponent(curNpc.id)+'/portrait-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||('Server '+r.status));
      onChanged&&onChanged();
    }catch(e){setError(e.message||String(e));setBusy('')}
  };
  // Single paste listener for this modal instance. Empty deps so it attaches ONCE on
  // mount and detaches on unmount - no double-binding, no stale closures.
  useEffect(()=>{
    const onPaste=(e)=>{
      if(stateRef.current.busy)return;
      const items=(e.clipboardData&&e.clipboardData.items)||[];
      for(let i=0;i<items.length;i++){
        const it=items[i];
        if(it.kind==='file'&&/^image\//.test(it.type||'')){
          const f=it.getAsFile();
          if(f){e.preventDefault();submitFileRef.current(f,'Uploading pasted image');return}
        }
      }
    };
    document.addEventListener('paste',onPaste);
    return()=>document.removeEventListener('paste',onPaste);
  },[]);
  // Drag-and-drop on the current-portrait area
  const onDrop=(e)=>{
    e.preventDefault();setDragOver(false);
    if(busy)return;
    const dt=e.dataTransfer;
    if(!dt)return;
    if(dt.files&&dt.files.length){submitFile(dt.files[0],'Uploading dropped file');return}
    const uri=dt.getData&&(dt.getData('text/uri-list')||dt.getData('text/plain'));
    if(uri&&/^https?:\/\//i.test(uri.trim())){setUrl(uri.trim());setTimeout(()=>{submitUrl()},10);return}
  };
  return(<div className="wg-modal-overlay" onClick={onClose}>
    <div className="wg-portrait-editor" onClick={e=>e.stopPropagation()}>
      <div className="wg-portrait-editor-header">
        <div>
          <div className="wg-portrait-editor-title">{npc.name||'Unnamed'}</div>
          <div className="wg-portrait-editor-sub">{npc.occupation||npc.role||''}</div>
        </div>
        <button className="wg-portrait-editor-close" onClick={onClose}>{'\u00D7'}</button>
      </div>
      <div className={"wg-portrait-editor-current"+(dragOver?" drag-over":"")}
           onDragOver={e=>{e.preventDefault();if(!busy)setDragOver(true)}}
           onDragLeave={()=>setDragOver(false)}
           onDrop={onDrop}>
        {photo?<img src={photo} alt=""/>:<div className="wg-portrait-editor-placeholder">No portrait set</div>}
        <div className="wg-portrait-editor-drop-hint">{dragOver?'\u2913 Drop to upload':'Drop an image here, or paste anywhere (Ctrl+V)'}</div>
      </div>
      <div className="wg-portrait-editor-section">
        <label className="wg-portrait-editor-label">{'\uD83D\uDCC1'} Choose file</label>
        <input type="file" accept="image/jpeg,image/png,image/webp" disabled={!!busy} onChange={e=>submitFile(e.target.files&&e.target.files[0],'Uploading file')}/>
      </div>
      <div className="wg-portrait-editor-divider"><span>or</span></div>
      <div className="wg-portrait-editor-section">
        <label className="wg-portrait-editor-label">{'\uD83D\uDD17'} Paste image URL</label>
        <div style={{display:'flex',gap:8}}>
          <input type="url" placeholder="https://..." value={url} disabled={!!busy} onChange={e=>setUrl(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submitUrl()}} style={{flex:1,padding:'7px 9px',borderRadius:6,border:'1px solid var(--border)',background:'var(--bg-deep)',color:'var(--text-primary)',fontSize:13}}/>
          <button className="wg-btn wg-btn-primary" disabled={!!busy||!url.trim()} onClick={submitUrl} style={{padding:'7px 14px'}}>Fetch</button>
        </div>
        <div className="wg-portrait-editor-hint">Or just <strong>Ctrl+V</strong> to paste a copied image directly. Right-click any image online {'\u2192'} Copy image {'\u2192'} paste here.</div>
      </div>
      {busy&&<div className="wg-portrait-editor-status">{busy}</div>}
      {error&&<div className="wg-portrait-editor-error">{error}</div>}
      <div className="wg-portrait-editor-foot">Manual portraits are locked - they survive AI regen and cast rematch.</div>
    </div>
  </div>);
}

function CharacterCreateModal({open,onClose,onCreated}){
  const[playerName,setPlayerName]=useState('');
  const[playerAge,setPlayerAge]=useState(30);
  const[playerGender,setPlayerGender]=useState('');
  const[pin,setPin]=useState('');
  const[playerOccupation,setPlayerOccupation]=useState('');
  const[playerBackstory,setPlayerBackstory]=useState('');
  const[photoUrl,setPhotoUrl]=useState('');
  const[creating,setCreating]=useState(false);
  const[error,setError]=useState(null);
  const create=async()=>{
    if(!playerName.trim()||!/^\d{3}$/.test(pin))return;
    setCreating(true);setError(null);
    try{
      const res=await fetch(API+'/players',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerName,playerAge,playerGender,pin,playerOccupation,playerBackstory,photoUrl})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Server error '+res.status);
      setPlayerName('');setPlayerAge(30);setPlayerGender('');setPin('');setPlayerOccupation('');setPlayerBackstory('');setPhotoUrl('');
      onCreated?.(data.player,pin);onClose();
    }catch(e){setError(e.message||String(e))}
    finally{setCreating(false)}
  };
  if(!open)return null;
  return <div className="wg-modal-overlay" onClick={e=>{e.stopPropagation();onClose()}}><div className="wg-modal wg-character-modal wg-polished-modal" onClick={e=>e.stopPropagation()}>
    <div className="wg-form-hero"><div className="wg-form-hero-icon">👤</div><div><h2>Create Character</h2><p>Build a reusable global character profile with a persistent portrait and PIN.</p></div></div>
    <div className="wg-build-kpis"><div className="wg-build-kpi">Global</div><div className="wg-build-kpi">Portrait</div><div className="wg-build-kpi">3 digit PIN</div></div>
    <div className="wg-field"><label>Name</label><input className="wg-input" value={playerName} onChange={e=>setPlayerName(e.target.value)} placeholder="Who are you?"/></div>
    <div className="wg-build-grid">
      <div className="wg-field"><label>Age</label><input className="wg-input" type="number" min="1" max="200" value={playerAge} onChange={e=>setPlayerAge(+e.target.value||30)}/></div>
      <div className="wg-field"><label>Gender</label><input className="wg-input" value={playerGender} onChange={e=>setPlayerGender(e.target.value)} placeholder="Optional"/></div>
    </div>
    <div className="wg-field"><label>3 Digit Pin</label><input className="wg-input" inputMode="numeric" maxLength={3} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,3))} placeholder="123"/></div>
    <div className="wg-field"><label>Occupation</label><input className="wg-input" value={playerOccupation} onChange={e=>setPlayerOccupation(e.target.value)} placeholder="What do you do?"/></div>
    <div className="wg-field"><label>Backstory</label><textarea className="wg-input" value={playerBackstory} onChange={e=>setPlayerBackstory(e.target.value)} rows={3} placeholder="Optional"/></div>
    <div className="wg-field"><label>Photo URL</label><input className="wg-input" value={photoUrl} onChange={e=>setPhotoUrl(e.target.value)} placeholder="Optional portrait image URL"/></div>
    {error&&<div className="wg-error-box"><strong>Character creation failed.</strong><br/>{error}</div>}
    <div className="wg-modal-actions"><button className="wg-btn" onClick={onClose}>Cancel</button><button className="wg-btn wg-btn-primary" onClick={create} disabled={!playerName.trim()||!/^\d{3}$/.test(pin)||creating}>{creating?'Generating portrait...':'Create Character'}</button></div>
  </div></div>
}

function CharacterAwardsModal({open,onClose,activePlayer,onSignedIn,onSignedOut,onCharacterCreated}){
  const[players,setPlayers]=useState([]);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[signingIn,setSigningIn]=useState('');
  const[pinTarget,setPinTarget]=useState(null);
  const[pinValue,setPinValue]=useState('');
  const[expandedPlayer,setExpandedPlayer]=useState(null);
  const[creatingCharacter,setCreatingCharacter]=useState(false);
  const[achievementIndexes,setAchievementIndexes]=useState({});
  const loadPlayers=useCallback(()=>{
    setLoading(true);setError(null);
    fetch(API+'/players').then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Server error '+r.status));return d}).then(d=>{setPlayers(Array.isArray(d.players)?d.players:[]);setLoading(false)}).catch(e=>{setError(e.message||String(e));setPlayers([]);setLoading(false)});
  },[]);
  useEffect(()=>{
    if(!open)return;
    loadPlayers();
  },[open,loadPlayers]);
  if(!open)return null;
  const medalCount=players.reduce((n,p)=>n+(p.medals?.length||0),0);
  const achievementCount=players.reduce((n,p)=>n+(p.achievements?.length||0),0);
  const historyCount=players.reduce((n,p)=>n+(p.questHistory?.length||0),0);
  const earnedDate=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
  const setQuestDifficulty=async(player,difficulty)=>{
    try{
      const headers={'Content-Type':'application/json'};
      try{const s=JSON.parse(localStorage.getItem('worldgen:activePlayer')||'null');if(s&&s.id===player.id&&s.pin){headers['x-global-player-id']=s.id;headers['x-global-player-pin']=s.pin}}catch(_){}
      const res=await fetch(API+'/players/'+encodeURIComponent(player.id),{method:'PATCH',headers,body:JSON.stringify({activeQuestDifficulty:difficulty})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Server error '+res.status);
      setPlayers(current=>current.map(p=>p.id===player.id?data.player:p));
    }catch(e){setError(e.message||String(e))}
  };
  const openSignIn=player=>{setPinTarget(player);setPinValue('');setError(null)};
  const handleCreated=(player,pin)=>{
    setPlayers(current=>[player,...current.filter(p=>p.id!==player.id)]);
    setExpandedPlayer(player.id);
    onSignedIn?.(player,pin);
    onCharacterCreated?.(player,pin);
  };
  const signIn=async()=>{
    const player=pinTarget;
    const pin=pinValue.trim();
    if(!player||!/^\d{3}$/.test(pin))return;
    setSigningIn(player.id);setError(null);
    try{
      const res=await fetch(API+'/players/'+encodeURIComponent(player.id)+'/sign-in',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Sign in failed');
      const signedPlayer=data.player||player;
      if(onSignedIn?.(signedPlayer,pin)===false)return;
      setPlayers(current=>current.map(p=>p.id===signedPlayer.id?signedPlayer:p));
      setPinTarget(null);setPinValue('');
    }catch(e){setError(e.message||String(e))}
    finally{setSigningIn('')}
  };
  const deleteCharacter=async player=>{
    if(!confirm('Delete '+(player.playerName||'this character')+'?'))return;
    setError(null);
    try{
      const res=await fetch(API+'/players/'+encodeURIComponent(player.id),{method:'DELETE'});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Delete failed');
      setPlayers(current=>current.filter(p=>p.id!==player.id));
      if(activePlayer?.id===player.id)onSignedOut?.();
    }catch(e){setError(e.message||String(e))}
  };
  const medalTypeInfo=item=>{
    const isWorld=/^world-medal:/i.test(String(item?.id||''))||item?.scope==='world'||item?.kind==='world';
    return {key:isWorld?'world':'global',label:isWorld?'World Medal':'Global Medal',image:isWorld?'/worldmed.png':'/globalmed.png'};
  };
  const groupedMedalRows=items=>{
    const groups=[];
    (items||[]).forEach(item=>{
      const info=medalTypeInfo(item);
      let group=groups.find(g=>g.key===info.key);
      if(!group){group={...info,count:0,latest:null};groups.push(group)}
      group.count++;
      const itemTime=Date.parse(item?.earnedAt||'')||0;
      const latestTime=Date.parse(group.latest?.earnedAt||'')||0;
      if(!group.latest||itemTime>=latestTime)group.latest=item;
    });
    return groups.map(group=>(
      <div key={'medal:'+group.key} className="wg-record-item" style={{borderColor:'rgba(250,204,21,.28)',background:'rgba(250,204,21,.06)'}}>
        <div style={{display:'flex',gap:9,alignItems:'flex-start'}}>
          <div style={{position:'relative',width:42,height:42,flexShrink:0}}>
            <img src={group.image} alt="" style={{width:42,height:42,objectFit:'contain',filter:'drop-shadow(0 0 10px rgba(250,204,21,.35))'}}/>
            <span style={{position:'absolute',top:-6,right:-7,minWidth:19,height:19,padding:'0 5px',borderRadius:999,display:'flex',alignItems:'center',justifyContent:'center',background:'#fde047',color:'#111827',border:'1px solid rgba(0,0,0,.45)',boxShadow:'0 0 10px rgba(250,204,21,.45)',fontSize:10,fontWeight:900,lineHeight:1}}>{group.count}</span>
          </div>
          <div style={{minWidth:0}}>
            <div className="wg-record-label">Medal Type</div>
            <div className="wg-record-value" style={{color:'#facc15'}}>{group.label}</div>
            <div className="wg-muted" style={{fontSize:12,marginTop:4}}>{group.count===1?'1 earned':group.count+' earned'}</div>
            {earnedDate(group.latest?.earnedAt)&&<div className="wg-muted" style={{fontSize:11,marginTop:6}}>Latest · {earnedDate(group.latest.earnedAt)}</div>}
          </div>
        </div>
      </div>
    ));
  };
  const achievementTile=(items,player)=>{
    const list=(items||[]).filter(Boolean);
    if(!list.length)return null;
    const current=((achievementIndexes[player.id]||0)%list.length+list.length)%list.length;
    const item=list[current];
    const nextAchievement=e=>{
      e.stopPropagation();
      if(list.length>1)setAchievementIndexes(currentIndexes=>({...currentIndexes,[player.id]:((currentIndexes[player.id]||0)+1)%list.length}));
    };
    return <div key={'achievement:'+player.id} className="wg-record-item" role="button" tabIndex={0} title={list.length>1?'Next achievement':'Achievement'} onClick={nextAchievement} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nextAchievement(e)}}} style={{borderColor:'rgba(148,163,184,.18)',background:'rgba(148,163,184,.05)',cursor:list.length>1?'pointer':'default'}}>
      <div style={{display:'flex',gap:9,alignItems:'flex-start'}}>
        <div style={{position:'relative',width:42,height:42,flexShrink:0}}>
          <img src={medalImageUrl(item)} alt="" style={{width:42,height:42,objectFit:'contain',filter:'drop-shadow(0 0 6px rgba(148,163,184,.35)) saturate(0.6)',opacity:0.85}}/>
          {list.length>1&&<span style={{position:'absolute',top:-6,right:-7,minWidth:19,height:19,padding:'0 5px',borderRadius:999,display:'flex',alignItems:'center',justifyContent:'center',background:'#cbd5e1',color:'#111827',border:'1px solid rgba(0,0,0,.45)',boxShadow:'0 0 10px rgba(148,163,184,.35)',fontSize:10,fontWeight:900,lineHeight:1}}>{current+1}/{list.length}</span>}
        </div>
        <div style={{minWidth:0}}>
          <div className="wg-record-label">Achievement{item.tier?' · '+item.tier:''}</div>
          <div className="wg-record-value">{item.name||item.id}</div>
          {item.description&&<div className="wg-muted" style={{fontSize:12,marginTop:4}}>{item.description}</div>}
          <div className="wg-muted" style={{fontSize:11,marginTop:6}}>{[item.questType,earnedDate(item.earnedAt)].filter(Boolean).join(' · ')}</div>
        </div>
      </div>
    </div>;
  };
  return <div className="wg-modal-overlay" onClick={onClose}><div className="wg-modal wg-character-modal" style={{maxWidth:620,padding:22}} onClick={e=>e.stopPropagation()}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:14}}>
      <h2 style={{color:'#fde047',fontSize:26,marginBottom:0}}>Characters</h2>
      <button className="wg-btn wg-btn-primary" style={{padding:'7px 10px',fontSize:11,fontFamily:"'JetBrains Mono',monospace",fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',flexShrink:0}} onClick={()=>setCreatingCharacter(true)}>New Character</button>
    </div>
    {activePlayer?.id&&<div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',padding:'9px 11px',border:'1px solid rgba(34,197,94,.36)',borderRadius:8,background:'rgba(34,197,94,.09)',marginBottom:12}}><div style={{display:'flex',gap:9,alignItems:'center',minWidth:0}}><img src={characterPhotoUrl(activePlayer)} alt="" style={{width:38,height:38,borderRadius:10,objectFit:'cover',border:'1px solid rgba(34,197,94,.38)',background:'#0d0d10',flexShrink:0}} onError={e=>{e.currentTarget.src=playerAvatarDataUrl(activePlayer)}}/><div style={{minWidth:0}}><div style={{fontSize:12,fontWeight:800,color:'#86efac'}}>Signed in as {activePlayer.playerName}</div><div className="wg-muted" style={{fontSize:11}}>This character enters every world from the world screen.</div></div></div><button className="wg-btn" style={{padding:'6px 9px',fontSize:11}} onClick={onSignedOut}>Sign out</button></div>}
    <div className="wg-check-summary" style={{gridTemplateColumns:'repeat(4,1fr)',gap:8,margin:'6px 0 14px'}}>
      <div className="wg-check-stat" style={{padding:8,background:'rgba(4,5,8,.66)'}}><b style={{fontSize:18,color:'#fde047'}}>{players.length}</b><span className="wg-muted">characters</span></div>
      <div className="wg-check-stat" style={{padding:8,background:'rgba(4,5,8,.66)'}}><b style={{fontSize:18,color:'#fde047'}}>{medalCount}</b><span className="wg-muted">medals</span></div>
      <div className="wg-check-stat" style={{padding:8,background:'rgba(4,5,8,.66)'}}><b style={{fontSize:18,color:'#fde047'}}>{achievementCount}</b><span className="wg-muted">achievements</span></div>
      <div className="wg-check-stat" style={{padding:8,background:'rgba(4,5,8,.66)'}}><b style={{fontSize:18,color:'#fde047'}}>{historyCount}</b><span className="wg-muted">history</span></div>
    </div>
    {error&&<div className="wg-error-box"><strong>Could not load awards.</strong><br/>{error}</div>}
    {loading?<div style={{textAlign:'center',padding:40}}><div className="wg-spinner"/></div>:players.length===0&&!error?<div className="wg-empty" style={{padding:'36px 10px'}}>No global characters or quest awards yet. Create a new character to begin.</div>:(
      <div style={{display:'grid',gap:8,maxHeight:'50vh',overflowY:'auto',paddingRight:4}}>
        {players.map(player=>{
          const medals=player.medals||[];const achievements=player.achievements||[];const facts=player.questFacts||[];const history=player.questHistory||[];const quest=player.activeQuest?.status==='active'?player.activeQuest:null;
          const portrait=characterPhotoUrl(player);
          const isExpanded=expandedPlayer===player.id;
          const isSignedIn=activePlayer?.id===player.id;
          return <div key={player.id} className="wg-detail-card" style={{marginBottom:0,padding:0,background:'rgba(4,5,8,.72)',overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',cursor:'pointer',userSelect:'none'}} onClick={()=>setExpandedPlayer(isExpanded?null:player.id)}>
              <img src={portrait} alt="" loading="lazy" style={{width:42,height:42,borderRadius:10,objectFit:'cover',border:'1.5px solid rgba(250,204,21,.35)',background:'#0d0d10',flexShrink:0}} onError={e=>{e.currentTarget.src=playerAvatarDataUrl(player)}}/>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:15,fontWeight:700,color:'#fde047',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{player.playerName||'Unnamed character'}</div></div>
              {isSignedIn&&<span style={{fontSize:9,fontWeight:800,color:'#86efac',textTransform:'uppercase',letterSpacing:.5,flexShrink:0}}>Signed in</span>}
              {quest&&<span style={{fontSize:9,fontWeight:800,color:'#facc15',textTransform:'uppercase',letterSpacing:.5,flexShrink:0}}>Quest</span>}
              <span style={{fontSize:14,color:'#64748b',transition:'transform .2s',transform:isExpanded?'rotate(90deg)':'rotate(0deg)',flexShrink:0}}>{'▶'}</span>
            </div>
            {isExpanded&&<div style={{padding:'0 12px 12px'}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start',marginBottom:8}}>
                <div style={{display:'flex',gap:6,alignItems:'center',minWidth:0}}><div style={{minWidth:0}}><div className="wg-muted" style={{fontSize:12,marginTop:2}}>{player.playerOccupation||'Traveller'}</div></div></div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'flex-end'}}>
                  <span className="wg-chip" style={{color:'#facc15'}}>Medals {medals.length}</span>
                  <span className="wg-chip">Achievements {achievements.length}</span>
                  <span className="wg-chip">History {history.length}</span>
                  <button className="wg-btn" style={{padding:'5px 8px',fontSize:11,color:'#f87171',borderColor:'rgba(248,113,113,.38)',background:'rgba(248,113,113,.08)'}} onClick={e=>{e.stopPropagation();deleteCharacter(player)}}>Delete</button>
                </div>
              </div>
              {quest&&<div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',padding:'8px 10px',border:'1px solid rgba(250,204,21,.35)',borderRadius:8,background:'rgba(250,204,21,.09)',marginBottom:9}}>
                <div style={{minWidth:0}}><div style={{fontSize:12,fontWeight:800,color:'#fde047'}}>Active: {quest.title||quest.name}</div><div className="wg-muted" style={{fontSize:11}}>Current world: {questWorldLabel(quest)}</div></div>
                <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
                  <select className="wg-model-select" style={{width:82,fontSize:10,padding:'5px 6px'}} value={quest.difficulty||'normal'} onChange={e=>setQuestDifficulty(player,e.target.value)} title="Quest difficulty">
                    <option value="easy">easy</option>
                    <option value="normal">normal</option>
                    <option value="hard">hard</option>
                  </select>
                  {isSignedIn?<button className="wg-btn wg-btn-primary" style={{padding:'6px 9px',fontSize:11,borderColor:'#00ff88',background:'#047857',color:'#fff',textShadow:'0 0 8px rgba(0,255,136,.55)',boxShadow:'0 0 12px rgba(0,255,136,.35)'}} onClick={()=>resumeQuest(quest)}>Resume</button>:<span className="wg-chip">Sign in to resume</span>}
                </div>
              </div>}
              <div style={{display:'flex',justifyContent:'flex-end',marginBottom:9}}>
                {isSignedIn?<span className="wg-chip" style={{color:'#86efac',borderColor:'rgba(34,197,94,.35)'}}>Signed in</span>:<button className="wg-btn wg-btn-primary" style={{padding:'6px 9px',fontSize:11}} onClick={()=>openSignIn(player)} disabled={signingIn===player.id}>{signingIn===player.id?'Signing in...':'Sign in'}</button>}
              </div>
              {(medals.length||achievements.length)?<div className="wg-record-grid">{groupedMedalRows(medals)}{achievementTile(achievements,player)}</div>:<div className="wg-muted" style={{fontSize:13}}>No completed global quest awards yet.</div>}
              {history.length>0&&<div style={{marginTop:10}}><div className="wg-record-label">Character History</div><div style={{display:'grid',gap:6}}>{history.slice().reverse().slice(0,6).map(e=><div key={e.id} style={{padding:'7px 9px',border:'1px solid rgba(148,163,184,.16)',borderRadius:8,background:'rgba(255,255,255,.04)',fontSize:12,lineHeight:1.35}}><span style={{color:e.status==='succeeded'?'#4ade80':e.status==='failed'?'#f87171':'#f59e0b',fontWeight:800,textTransform:'uppercase',fontSize:10,marginRight:6}}>{e.status}</span><span style={{color:'#e8eaf0'}}>{e.questName}</span><div className="wg-muted" style={{fontSize:11,marginTop:3}}>{e.message}</div><div className="wg-muted" style={{fontSize:10,marginTop:3}}>{earnedDate(e.createdAt)}</div></div>)}</div></div>}
              {facts.length>0&&<div style={{marginTop:10}}><div className="wg-record-label">Quest Facts</div><div className="wg-chip-list">{facts.slice(0,10).map(f=><span key={f.id||f.summary} className="wg-chip">{f.summary||f.title||f.id}</span>)}</div></div>}
            </div>}
          </div>
        })}
      </div>
    )}
    {pinTarget&&<div className="wg-modal-overlay" style={{background:'rgba(0,0,0,.42)',backdropFilter:'blur(3px)',zIndex:1200}} onClick={()=>{if(!signingIn){setPinTarget(null);setPinValue('')}}}>
      <div className="wg-modal" style={{maxWidth:360,padding:18,borderColor:'rgba(250,204,21,.42)',background:'rgba(8,9,13,.96)'}} onClick={e=>e.stopPropagation()}>
        <h2 style={{fontSize:22,marginBottom:8,color:'#fde047'}}>Sign In</h2>
        <div className="wg-muted" style={{fontSize:12,marginBottom:14}}>Enter the 3 digit PIN for {pinTarget.playerName||'this character'}.</div>
        <input className="wg-input" autoFocus inputMode="numeric" maxLength={3} value={pinValue} onChange={e=>setPinValue(e.target.value.replace(/\D/g,'').slice(0,3))} onKeyDown={e=>{if(e.key==='Enter')signIn();if(e.key==='Escape'&&!signingIn){setPinTarget(null);setPinValue('')}}} placeholder="123"/>
        <div className="wg-modal-actions" style={{marginTop:16}}>
          <button className="wg-btn" onClick={()=>{setPinTarget(null);setPinValue('')}} disabled={!!signingIn}>Cancel</button>
          <button className="wg-btn wg-btn-primary" onClick={signIn} disabled={!/^\d{3}$/.test(pinValue)||!!signingIn}>{signingIn?'Signing in...':'Sign in'}</button>
        </div>
      </div>
    </div>}
    <CharacterCreateModal open={creatingCharacter} onClose={()=>setCreatingCharacter(false)} onCreated={handleCreated}/>
    <div className="wg-modal-actions"><button className="wg-btn wg-btn-primary" onClick={onClose}>Done</button></div>
  </div></div>
}

function GlobalQuestBoard({players,worlds,onSelectWorld,onRefresh,activePlayer,onRequireSignIn,questManagerOpen,onQuestManagerOpenChange}){
  const expanded=!!questManagerOpen;
  const setExpanded=value=>onQuestManagerOpenChange&&onQuestManagerOpenChange(typeof value==='function'?!!value(expanded):!!value);
  const questManagerPinned=expanded;
  const[inProgressPanelOpen,setInProgressPanelOpen]=useState(true);
  const[activeQuestPanel,setActiveQuestPanel]=useState('global');
  const[busyAdventure,setBusyAdventure]=useState('');
  const[busyWorldQuest,setBusyWorldQuest]=useState('');
  const[coopBusy,setCoopBusy]=useState('');
  const[coopRevision,setCoopRevision]=useState(0);
  const[worldQuestSteps,setWorldQuestSteps]=useState({});
  const[worldQuestModes,setWorldQuestModes]=useState({});
  const[expandedAdventureReqs,setExpandedAdventureReqs]=useState({});const[advListIndex,setAdvListIndex]=useState({});const[worldQuestListIndex,setWorldQuestListIndex]=useState({});
  const[timelineAdventureWorldId,setTimelineAdventureWorldId]=useState('');const[timelineAdventureSelections,setTimelineAdventureSelections]=useState({});
  const[questConfirm,setQuestConfirm]=useState(null);
  const questConfirmResolve=useRef(null);
  const questBoardRef=useRef(null);
  useEffect(()=>{
    if(!expanded)return;
    requestAnimationFrame(()=>{
      const top=(questBoardRef.current?.getBoundingClientRect?.().top||0)+window.scrollY-92;
      window.scrollTo({top:Math.max(0,top),behavior:'auto'});
    });
  },[expanded]);
  const worldsById=Object.fromEntries((worlds||[]).map(w=>[w.id,w]));
  const active=(players||[]).flatMap(player=>[player.activeQuest,...(player.activeGlobalQuests||[])].filter(q=>q?.status==='active').map(quest=>({player,quest}))).filter((x,i,a)=>a.findIndex(y=>y.player.id===x.player.id&&y.quest.id===x.quest.id)===i);
  const dormant=(worlds||[]).flatMap(world=>(world.questPool||[]).filter(seed=>seed.status!=='completed').map(seed=>({world,seed})));
  const worldQuestWorlds=(worlds||[]).filter(w=>(w.worldQuestAdventures&&w.worldQuestAdventures.length)||(w.sourceDocuments&&w.sourceDocuments.length)||w.realWorldBased||w.realWorldFacts);
  const worldQuestRows=worldQuestWorlds.flatMap(world=>(world.worldQuestAdventures&&world.worldQuestAdventures.length?world.worldQuestAdventures:[null]).map(quest=>({world,quest})));
  const worldQuestTileGroups=Object.values(worldQuestRows.reduce((acc,row)=>{
    const key=String(row.world?.concept||row.world?.name||row.world?.id||'World').trim().toLowerCase();
    const slot=acc[key]||(acc[key]={key,world:row.world,rows:[]});
    slot.rows.push(row);
    return acc;
  },{}));
  const activeWorldQuestRows=worldQuestRows.filter(({quest})=>quest?.status==='active');
  const timelineAdventureWorlds=(worlds||[]).filter(w=>(w.timeline||[]).length).sort((a,b)=>String(a.concept||'').localeCompare(String(b.concept||'')));
  const timelineAdventureWorld=timelineAdventureWorlds.find(w=>w.id===timelineAdventureWorldId)||timelineAdventureWorlds[0]||null;
  const selectedTimelineAdventureIds=timelineAdventureWorld?(timelineAdventureSelections[timelineAdventureWorld.id]||[]):[];
  const adventureWorlds=(worlds||[]).filter(w=>(w.serializedAdventures&&w.serializedAdventures.length)||(w.sourceDocuments&&w.sourceDocuments.length)).sort((a,b)=>{
    const aCount=(a.serializedAdventures||[]).length;
    const bCount=(b.serializedAdventures||[]).length;
    if(!!bCount!==!!aCount)return bCount?1:-1;
    return String(a.concept||'').localeCompare(String(b.concept||''));
  });
  const adventureRows=adventureWorlds.flatMap(world=>(world.serializedAdventures||[]).map(adv=>({world,adventure:adv})));
  const activeAdventureRows=adventureRows.filter(({adventure})=>adventure?.status==='active');
  const inProgressCount=active.length+activeWorldQuestRows.length+activeAdventureRows.length;
  const askQuestConfirm=message=>new Promise(resolve=>{questConfirmResolve.current=resolve;setQuestConfirm({message})});
  const closeQuestConfirm=answer=>{
    const resolve=questConfirmResolve.current;
    questConfirmResolve.current=null;
    setQuestConfirm(null);
    if(resolve)resolve(!!answer);
  };
  const refreshQuestBoardView=async ()=>{
    const boardTop=(questBoardRef.current?.getBoundingClientRect?.().top||0)+window.scrollY-92;
    const shouldReturnToBoard=expanded;
    await Promise.resolve(onRefresh&&onRefresh());
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    if(shouldReturnToBoard)window.scrollTo({top:Math.max(0,boardTop)});
  };
  const queuePendingWorldQuest=(kind,world,quest,extra)=>{
    try{sessionStorage.setItem('worldgen:pendingWorldQuest',JSON.stringify({kind,worldId:world?.id||'',questId:quest?.id||'',replace:!!extra?.replace,at:Date.now()}))}catch(_){}
    onRequireSignIn&&onRequireSignIn();
  };
  const queuePendingGlobalQuest=seed=>{
    try{sessionStorage.setItem('worldgen:pendingGlobalQuest',JSON.stringify({worldId:seed?.worldId||'',seedId:seed?.id||'',at:Date.now()}))}catch(_){}
    onRequireSignIn&&onRequireSignIn();
  };
  const beginSeed=async seed=>{
    const availablePlayers=(players||[]).filter(p=>p?.id);
    if(!availablePlayers.length){alert('Create a global character first.');return}
    let player=activePlayer?.id?availablePlayers.find(p=>p.id===activePlayer.id):availablePlayers[0];
    if(!player){onRequireSignIn&&onRequireSignIn();return}
    const activeForPlayer=active.filter(x=>x.player.id===player.id).length;
    const maxActiveGlobalQuests=3;
    const globalQuestSlotLabels=['first','second','third'];
    if(activeForPlayer>=maxActiveGlobalQuests){alert('This character already has 3 active global quests. Finish, leave, or abandon one first.');return}
    if(!(activePlayer?.id===player.id&&activePlayer?.pin)){queuePendingGlobalQuest(seed);return}
    if(!await askQuestConfirm((activeForPlayer>0?'This will use '+(player.playerName||'this character')+' '+(globalQuestSlotLabels[activeForPlayer]||'next')+' global quest slot. ':'')+'Begin this quest thread in '+(seed.worldName||'this world')+'?'))return;
    const pin=activePlayer.pin;
    try{
      const res=await fetch(API+'/worlds/'+encodeURIComponent(seed.worldId)+'/quest-pool/'+encodeURIComponent(seed.id)+'/begin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({globalPlayerId:player.id,pin})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Server error '+res.status);
      const npcId=data.seed?.giverNpcId||seed.giverNpcId||'';
      const locId=data.seed?.locationId||seed.locationId||'';
      window.location.href='/index.html?session='+encodeURIComponent(data.session.id)+'&world='+encodeURIComponent(seed.worldId)+'&questStart=1&questTitle='+encodeURIComponent(data.quest?.title||data.quest?.name||seed.title||'Quest')+(npcId?'&focusNpc='+encodeURIComponent(npcId):'')+(locId?'&focusLoc='+encodeURIComponent(locId):'');
    }catch(e){alert(e.message||String(e))}
  };
  const ensureSignedWorldQuestSession=async world=>{
    if(!activePlayer?.id||!activePlayer?.pin){onRequireSignIn&&onRequireSignIn();return null}
    const res=await fetch(API+'/worlds/'+encodeURIComponent(world.id)+'/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({globalPlayerId:activePlayer.id,pin:activePlayer.pin,allowQuestEntry:true})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||('Server error '+res.status));
    return {...data.session,globalPlayerId:activePlayer.id};
  };
  const playerAuthHeaders=()=>({'Content-Type':'application/json','x-global-player-id':activePlayer?.id||'','x-global-player-pin':activePlayer?.pin||''});
  const playerAuthBody=extra=>JSON.stringify({...(extra||{}),globalPlayerId:activePlayer?.id||'',pin:activePlayer?.pin||''});
  const worldQuestStepValue=world=>Math.max(3,Math.min(30,parseInt(worldQuestSteps[world.id]??'5',10)||5));
  const worldQuestModeValue=world=>worldQuestModes[world.id]||'easy';
  const setWorldQuestStepValue=(world,value)=>setWorldQuestSteps(v=>({...v,[world.id]:Math.max(3,Math.min(30,parseInt(value,10)||15))}));
  const setWorldQuestModeValue=(world,value)=>setWorldQuestModes(v=>({...v,[world.id]:value}));
  const stepWorldQuestSteps=(world,delta)=>setWorldQuestStepValue(world,worldQuestStepValue(world)+delta);
  const rotateWorldQuestMode=world=>{
    const order=['easy','normal','hard'];
    const next=order[(order.indexOf(worldQuestModeValue(world))+1)%order.length];
    setWorldQuestModeValue(world,next);
  };
  const worldQuestModeLabel=world=>({easy:'EASY',normal:'NORM',hard:'HARD'}[worldQuestModeValue(world)]||'NORM');
  const generateWorldQuest=async (world,replace=false)=>{
    if(!activePlayer?.id||!activePlayer?.pin){queuePendingWorldQuest('generate',world,null,{replace});return}
    if(!await askQuestConfirm('Start a World Quest for '+(world.concept||'this world')+'?'))return;
    setBusyWorldQuest(world.id);
    let session;
    try{session=await ensureSignedWorldQuestSession(world)}catch(e){alert(e.message||String(e));setBusyWorldQuest('');return}
    if(!session){setBusyWorldQuest('');return}
    if(session.canStartWorldQuest===false||session.hasActiveQuest||session.hasActiveWorldQuest){alert((session.playerName||'This character')+' cannot start a World Quest right now.');setBusyWorldQuest('');return}
    const requirementCount=worldQuestStepValue(world);
    const npcRequirementMode=worldQuestModeValue(world);
    try{
      const needsReinit=replace;
      const res=await fetchWithTimeout(API+'/worlds/'+encodeURIComponent(world.id)+'/world-quests/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({replace:needsReinit,requirementCount,npcRequirementMode})},120000,'World Quest generation timed out. Check the backend or LLM provider, then try again.');
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Server error '+res.status);
      if(data.validation)alert(data.validation);
      const quest=data.quest;
      if(!quest?.id)throw new Error('World Quest generation returned no quest');
      const startRes=await fetchWithTimeout(API+'/sessions/'+encodeURIComponent(session.id)+'/world-quests/'+encodeURIComponent(quest.id)+'/start',{method:'POST',headers:playerAuthHeaders(),body:playerAuthBody()},30000,'World Quest start timed out. Check the backend, then try again.');
      const startData=await startRes.json().catch(()=>({}));
      if(!startRes.ok)throw new Error(startData.detail||startData.error||'World Quest start failed');
      window.location.href='/index.html?session='+encodeURIComponent(startData.session?.id||session.id)+'&world='+encodeURIComponent(world.id)+'&questStart=1&questTitle='+encodeURIComponent(startData.worldQuest?.title||quest.title||'World Quest');
    }catch(e){alert(e.message||String(e))}
    finally{setBusyWorldQuest('')}
  };
  const attachWorldQuestSource=async world=>{
    const title=prompt('Source title for '+(world.concept||'this world'));
    if(title===null)return;
    const source=prompt('URL or public path, for example /lost.pdf or public/lost.pdf');
    if(source===null)return;
    const summary=prompt('Short source facts or notes');
    if(summary===null)return;
    setBusyWorldQuest(world.id);
    try{
      const text=(title+' '+source+' '+summary+' '+(world.concept||'')).toLowerCase();
      const inferredSourceType=/\b(film|movie|cinema|blade|alien|freddy|krueger|lost boys)\b/.test(text)?'Film':/\b(book|novel|shades|chapter)\b/.test(text)?'Book':/\b(real event|incident|war|battle|history|historical)\b/.test(text)?'Real Event':'Story';
      const body={title:title.trim()||source.trim(),type:/\.pdf($|\?)/i.test(source)?'pdf':/^https?:/i.test(source)?'url':'text',sourceType:inferredSourceType,summary:summary.trim()};
      if(/^https?:/i.test(source))body.url=source.trim();else{const clean=source.trim().replace(/^\/+/,'');body.path=clean.startsWith('public/')?clean:'public/'+clean}
      const res=await fetch(API+'/worlds/'+encodeURIComponent(world.id)+'/world-quests/source-documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Server error '+res.status);
      onRefresh&&onRefresh();
    }catch(e){alert(e.message||String(e))}
    finally{setBusyWorldQuest('')}
  };
  const startWorldQuest=async (world,quest)=>{
    if(!activePlayer?.id||!activePlayer?.pin){queuePendingWorldQuest('start',world,quest);return}
    if(quest.status==='active'){
      let session;
      try{session=await ensureSignedWorldQuestSession(world)}catch(e){alert(e.message||String(e));return}
      if(!session)return;
      if(session.activeWorldQuest?.id===quest.id||session.activeWorldQuestId===quest.id||session.activeWorldQuestTitle===quest.title){window.location.href='/index.html?session='+encodeURIComponent(session.id)+'&world='+encodeURIComponent(world.id)+'&questStart=1&questTitle='+encodeURIComponent(quest.title||'World Quest');return}
      setBusyWorldQuest(world.id);
      try{
        const res=await fetchWithTimeout(API+'/sessions/'+encodeURIComponent(session.id)+'/world-quests/'+encodeURIComponent(quest.id)+'/request-join',{method:'POST',headers:playerAuthHeaders(),body:playerAuthBody()},30000,'World Quest join request timed out. Check the backend, then try again.');
        const data=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(data.error||'World Quest join request failed');
        if(data.status==='accepted'){window.location.href='/index.html?session='+encodeURIComponent(data.session?.id||session.id)+'&world='+encodeURIComponent(world.id)+'&questStart=1&questTitle='+encodeURIComponent(data.worldQuest?.title||quest.title||'World Quest');return}
        const requestId=data.request?.id;
        await refreshQuestBoardView();
        if(!requestId){alert('Join request sent.');return}
        const startedAt=Date.now();
        while(Date.now()-startedAt<90000){
          await new Promise(resolve=>setTimeout(resolve,2000));
          const poll=await fetch(API+'/sessions/'+encodeURIComponent(session.id)+'/world-quests/'+encodeURIComponent(quest.id)+'/join-requests/'+encodeURIComponent(requestId),{headers:playerAuthHeaders()});
          const pd=await poll.json().catch(()=>({}));
          if(poll.ok&&pd.status==='accepted'){window.location.href='/index.html?session='+encodeURIComponent(pd.session?.id||session.id)+'&world='+encodeURIComponent(world.id)+'&questStart=1&questTitle='+encodeURIComponent(pd.worldQuest?.title||quest.title||'World Quest');return}
          if(poll.ok&&pd.status==='declined'){alert('Join request refused.');return}
        }
        alert('Join request sent. Waiting for the World Quest player to answer.');
      }catch(e){alert(e.message||String(e))}
      finally{setBusyWorldQuest('')}
      return;
    }
    let session;
    try{session=await ensureSignedWorldQuestSession(world)}catch(e){alert(e.message||String(e));return}
    if(!session)return;
    if(session.canStartWorldQuest===false||session.hasActiveQuest||session.hasActiveWorldQuest){alert((session.playerName||'This character')+' cannot start a World Quest right now.');return}
    if(!await askQuestConfirm('Begin this World Quest with '+(session.playerName||'this character')+'?'))return;
    setBusyWorldQuest(world.id);
    try{
      const res=await fetchWithTimeout(API+'/sessions/'+encodeURIComponent(session.id)+'/world-quests/'+encodeURIComponent(quest.id)+'/start',{method:'POST',headers:playerAuthHeaders(),body:playerAuthBody()},30000,'World Quest start timed out. Check the backend, then try again.');
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.detail||data.error||'Server error '+res.status);
      window.location.href='/index.html?session='+encodeURIComponent(data.session?.id||session.id)+'&world='+encodeURIComponent(world.id)+'&questStart=1&questTitle='+encodeURIComponent(quest.title||'World Quest');
    }catch(e){alert(e.message||String(e))}
    finally{setBusyWorldQuest('')}
  };
  useEffect(()=>{
    if(!activePlayer?.id||!activePlayer?.pin)return;
    let pendingGlobal=null;
    try{pendingGlobal=JSON.parse(sessionStorage.getItem('worldgen:pendingGlobalQuest')||'null')}catch(_){}
    if(pendingGlobal?.worldId&&pendingGlobal?.seedId&&Date.now()-Number(pendingGlobal.at||0)<=10*60*1000){
      const world=(worlds||[]).find(w=>w.id===pendingGlobal.worldId);
      const seed=(world?.questPool||[]).find(s=>s.id===pendingGlobal.seedId);
      try{sessionStorage.removeItem('worldgen:pendingGlobalQuest')}catch(_){}
      if(seed){setTimeout(()=>beginSeed(seed),0);return}
    }else if(pendingGlobal?.worldId){try{sessionStorage.removeItem('worldgen:pendingGlobalQuest')}catch(_){}}
    let pending=null;
    try{pending=JSON.parse(sessionStorage.getItem('worldgen:pendingWorldQuest')||'null')}catch(_){}
    if(!pending?.worldId)return;
    if(Date.now()-Number(pending.at||0)>10*60*1000){try{sessionStorage.removeItem('worldgen:pendingWorldQuest')}catch(_){};return}
    const world=(worlds||[]).find(w=>w.id===pending.worldId);
    if(!world)return;
    try{sessionStorage.removeItem('worldgen:pendingWorldQuest')}catch(_){}
    setTimeout(()=>{
      if(pending.kind==='generate'){generateWorldQuest(world,!!pending.replace);return}
      const quest=(world.worldQuestAdventures||[]).find(q=>q.id===pending.questId);
      if(quest)startWorldQuest(world,quest);
    },0);
  },[activePlayer?.id,activePlayer?.pin,worlds]);
  const deleteWorldQuest=async (world,quest)=>{
    if(!quest||!await askQuestConfirm('Delete World Quest '+(quest.title||world.concept||'this quest')+'?'))return;
    setBusyWorldQuest(world.id);
    try{
      const res=await fetch(API+'/worlds/'+encodeURIComponent(world.id)+'/world-quests/'+encodeURIComponent(quest.id),{method:'DELETE'});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Delete failed');
      onRefresh&&onRefresh();
    }catch(e){alert(e.message||String(e))}
    finally{setBusyWorldQuest('')}
  };
  const toggleWorldQuestCoop=async (world,quest)=>{
    if(!quest)return;
    const key=world.id+':'+quest.id;
    setCoopBusy(key);
    try{
      const res=await fetch(API+'/worlds/'+encodeURIComponent(world.id)+'/world-quests/'+encodeURIComponent(quest.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({allowCoop:!quest.allowCoop})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Co-op update failed');
      quest.allowCoop=data.quest?.allowCoop ?? !quest.allowCoop;
      setCoopRevision(v=>v+1);
    }catch(e){alert(e.message||String(e))}
    finally{setCoopBusy('')}
  };
  const abandonWorldQuest=async (world,quest)=>{
    const sessionId=activeWorldQuestPlayerSessionId(quest);
    if(!sessionId){alert('Only the signed-in World Quest player can cancel this World Quest.');return}
    if(!await askQuestConfirm('Cancel active World Quest '+(quest.title||world.concept||'this World Quest')+'?'))return;
    setBusyWorldQuest(world.id);
    try{
      const res=await fetch(API+'/sessions/'+encodeURIComponent(sessionId)+'/world-quests/abandon',{method:'POST',headers:playerAuthHeaders(),body:playerAuthBody()});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'World Quest cancel failed');
      await refreshQuestBoardView();
    }catch(e){alert(e.message||String(e))}
    finally{setBusyWorldQuest('')}
  };
  const deleteQuestSeed=async seed=>{
    if(!seed||!await askQuestConfirm('Delete quest '+(seed.title||'this quest')+'?'))return;
    try{
      const res=await fetch(API+'/worlds/'+encodeURIComponent(seed.worldId)+'/quest-pool/'+encodeURIComponent(seed.id),{method:'DELETE'});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Delete failed');
      onRefresh&&onRefresh();
    }catch(e){alert(e.message||String(e))}
  };
  const generateAdventure=async world=>{
    if(!activePlayer?.id||!activePlayer?.pin){onRequireSignIn&&onRequireSignIn();return}
    if(!await askQuestConfirm('Generate a Serialized Adventure for '+(world.concept||'this world')+'?'))return;
    setBusyAdventure(world.id);
    try{
      const res=await fetch(API+'/worlds/'+encodeURIComponent(world.id)+'/serialized-adventures/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'Generation failed');
      onRefresh&&onRefresh();

function CreateModal({open,onClose,onCreated}){
  const initialLlm=useRef(readStoredLlmSelection(PROVIDERS));
  const[prov,setProv]=useState(initialLlm.current.provider);const[model,setModel]=useState(initialLlm.current.model);
  const[concept,setConcept]=useState('');const[generating,setGenerating]=useState(false);
  const[error,setError]=useState(null);const[phase,setPhase]=useState('');
  const[progress,setProgress]=useState(0);
  const abortRef=useRef(null);const progressRef=useRef(null);
  const provObj=PROVIDERS.find(p=>p.id===prov);
  useEffect(()=>{persistLlmSelection(prov,model)},[prov,model]);
  const clearGeneration=useCallback(()=>{
    if(progressRef.current){clearInterval(progressRef.current);progressRef.current=null}
    abortRef.current=null;
  },[]);
  const stopGeneration=useCallback((opts={})=>{
    const {abort=false,errorMessage=null,resetPhase=true}=opts;
    if(abortRef.current&&abort)abortRef.current.abort();
    clearGeneration();
    setGenerating(false);
    setProgress(0);
    if(resetPhase)setPhase('');
    if(errorMessage)setError(errorMessage);
  },[clearGeneration]);
  useEffect(()=>()=>{if(abortRef.current)abortRef.current.abort();clearGeneration()},[clearGeneration]);
  const generate=async()=>{
    if(!concept.trim())return;
    stopGeneration({resetPhase:false});
    const controller=new AbortController();abortRef.current=controller;
    setGenerating(true);setError(null);setPhase('Initialising...');setProgress(3);
    const phases=[
      {p:10,t:'Building geography...'},
      {p:24,t:'Defining culture...'},
      {p:42,t:'Generating NPCs...'},
      {p:58,t:'Creating economy...'},
      {p:74,t:'Placing locations...'},
      {p:88,t:'Finalising world...'}
    ];
    let pi=0;progressRef.current=setInterval(()=>{if(pi<phases.length){setProgress(phases[pi].p);setPhase(phases[pi].t);pi++}else setProgress(p=>Math.min(95,p+1))},5000);
    try{
      const res=await fetch(API+'/worlds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concept:concept.trim(),provider:prov,model}),signal:controller.signal});
      if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.detail||err.error||'Server error '+res.status)}
      const data=await res.json();
      clearGeneration();
      setProgress(100);setPhase('World ready.');setConcept('');
      setTimeout(()=>{setGenerating(false);onCreated(data.world)},250);
    }catch(e){
      if(e.name==='AbortError'){stopGeneration();return}
      stopGeneration({errorMessage:e.message||String(e)});
      setPhase('Generation failed.');
    }
  };
  const closeModal=()=>{if(generating)stopGeneration({abort:true});onClose()};
  if(!open)return null;
  return(
    <div className="wg-modal-overlay" onClick={e=>{if(e.target===e.currentTarget)closeModal()}}><div className="wg-modal" onClick={e=>e.stopPropagation()}>
      {generating?(<div style={{textAlign:'center',padding:'40px 20px'}}><div className="wg-spinner"/><h2 style={{fontFamily:"'Instrument Serif',serif",fontSize:24}}>Generating World</h2><div className="wg-gen-percent">{progress}%</div><div className="wg-progress"><div className="wg-progress-fill" style={{width:progress+'%'}}/></div><div className="wg-gen-msg">{phase}<br/>This can take 30-60 seconds.</div><div className="wg-modal-actions" style={{justifyContent:'center',marginTop:20}}><button className="wg-btn" onClick={()=>stopGeneration({abort:true})}>Stop</button></div></div>):(
        <><h2>Create a World</h2>
        <div className="wg-field"><label>Concept</label><textarea className="wg-input" placeholder="A 1970s Yorkshire mining town where everyone has secrets..." value={concept} onChange={e=>setConcept(e.target.value)} rows={3}/></div>
        <div className="wg-field"><label>AI Provider</label><div className="wg-providers">{PROVIDERS.map(p=>(<div key={p.id} className={'wg-provider-chip'+(prov===p.id?' active':'')} onClick={()=>{setProv(p.id);setModel(p.models[0])}} style={prov===p.id?{borderColor:p.color,background:p.color+'15'}:{}}><span>{p.icon}</span> {p.label}</div>))}</div></div>
        <div className="wg-field"><label>Model</label><select className="wg-model-select" value={model} onChange={e=>setModel(e.target.value)}>{provObj?.models.map(m=><option key={m} value={m}>{m}</option>)}</select></div>
        {error&&<div className="wg-error-box"><strong>World generation failed.</strong><br/>{error}</div>}
        <div className="wg-modal-actions"><button className="wg-btn" onClick={closeModal}>Cancel</button><button className="wg-btn wg-btn-primary" onClick={generate} disabled={!concept.trim()}>Generate World</button></div></>
      )}</div></div>);
}

function BuildWorldModal({open,onClose,onCreated}){

  const[concept,setConcept]=useState('');
  const[prov,setProv]=useState(stored.provider);

  const[building,setBuilding]=useState(false);

  const[progress,setProgress]=useState(0);
  const[buildSteps,setBuildSteps]=useState([]);
  const[liveLogs,setLiveLogs]=useState([]);
  const[resetWorlds,setResetWorlds]=useState([]);
  const[resetId,setResetId]=useState('');
  const[baselineSetId,setBaselineSetId]=useState('');
  const[mode,setMode]=useState('build');
  const[error,setError]=useState(null);
  const abortRef=useRef(null);
  const progressRef=useRef(null);
  const jobRef=useRef(null);
  const[srcInfo,setSrcInfo]=useState(null);
  const[srcBusy,setSrcBusy]=useState(false);
  const[srcErr,setSrcErr]=useState('');
  const[srcYear,setSrcYear]=useState('');
  const srcInputRef=useRef(null);
  const[srcUrl,setSrcUrl]=useState('');const fetchSourceUrl=async()=>{const u=String(srcUrl||'').trim();if(!/^https?:\/\//i.test(u)){setSrcErr('Need a full http(s) URL');return;}setSrcErr('');setSrcBusy(true);setSrcInfo(null);try{const r=await fetch(API+'/worlds/source-fetch-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.detail||d.error||('Fetch failed '+r.status));setSrcInfo(d);}catch(e){setSrcErr(e.message||String(e));}finally{setSrcBusy(false);}};const attachSource=async(file)=>{if(!file)return;if(!/\.pdf$/i.test(file.name)){setSrcErr('PDF files only');return;}setSrcErr('');setSrcBusy(true);setSrcInfo(null);try{const dataBase64=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).replace(/^data:[^,]*,/,''));fr.onerror=()=>reject(new Error('read failed'));fr.readAsDataURL(file);});const r=await fetch(API+'/worlds/source-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,dataBase64})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.detail||d.error||('Upload failed '+r.status));setSrcInfo(d);}catch(e){setSrcErr(e.message||String(e));}finally{setSrcBusy(false);}};
  const provObj=BUILD_PROVIDERS.find(p=>p.id===prov)||BUILD_PROVIDERS[0];
  useEffect(()=>{persistLlmSelection(prov,model)},[prov,model]);
  const clearBuildProgress=()=>{
    if(progressRef.current){clearInterval(progressRef.current);progressRef.current=null}
  };
  useEffect(()=>()=>{if(abortRef.current)abortRef.current.abort();clearBuildProgress()},[]);
  useEffect(()=>{if(open){fetch(API+'/worlds').then(r=>r.json()).then(d=>setResetWorlds(Array.isArray(d.worlds)?d.worlds.filter(Boolean):[])).catch(()=>{})}},[open]);
  const runBuild=async()=>{
    if(!concept.trim())return;
    if(srcBusy){setError('Wait for the source PDF/URL to finish loading before starting the build.');return;}
    const controller=new AbortController();abortRef.current=controller;
    const phases=[
      {p:8,t:'Preparing hardened build job'},
      {p:16,t:'Generating world DNA'},
      {p:28,t:'Building locations and geography'},
      {p:42,t:'Generating NPC batches'},
      {p:58,t:'Writing relationships and daily life'},
      {p:70,t:'Building timeline and culture'},
      {p:82,t:'Repairing and validating world data'},
      {p:92,t:'Saving checkpoints and final world'}
    ];
    clearBuildProgress();
    setBuilding(true);setError(null);setPhase(phases[0].t);setProgress(4);setBuildSteps([]);setLiveLogs([]);jobRef.current=null;
    var stepIndex=0;
    progressRef.current=setInterval(()=>{
      if(stepIndex<phases.length){
        const next=phases[stepIndex++];
        setProgress(next.p);
        setPhase(next.t);
        setBuildSteps(s=>s.includes(next.t)?s:[...s,next.t].slice(-6));
      }else{
        setProgress(p=>Math.min(96,p+1));
      }
    },4500);
    try{
      const res=await fetch(API+'/worlds/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concept:concept.trim(),provider:prov,model,npcs,batchSize,locations,timelineEvents,retries,...(srcInfo?{sourcePath:srcInfo.pdfPath,sourceTextPath:srcInfo.textPath,sourceTitle:srcInfo.title}:{}),...((srcYear&&/^\d{4}$/.test(String(srcYear).trim()))?{sourceYear:Number(srcYear)}:{})}),signal:controller.signal});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.detail||data.error||'Server error '+res.status);
      if(!data.jobId)throw new Error('Build job was not started.');
      jobRef.current=data.jobId;
      setLiveLogs(data.logs||[]);
      var done=false;
      while(!done){
        await new Promise(r=>setTimeout(r,2000));
        const sr=await fetch(API+'/worlds/build/'+encodeURIComponent(data.jobId),{signal:controller.signal});
        const sd=await sr.json().catch(()=>({}));
        if(!sr.ok)throw new Error(sd.detail||sd.error||'Build status error '+sr.status);
        setLiveLogs(sd.logs||[]);
        const latest=(sd.logs||[]).slice(-1)[0];
        if(latest)setPhase(latest.replace(/^[✓✗╳\s]+/,'').replace(/^\[\d+%\]\s*/,'').slice(0,120));
        const pctMatch=(sd.logs||[]).slice().reverse().find(l=>/^\[\d+%\]/.test(l));
        if(pctMatch){const p=parseInt(pctMatch.match(/^\[(\d+)%\]/)[1],10);if(p>0)setProgress(prev=>Math.max(prev,p));}
        if(sd.status==='completed'){
          done=true;clearBuildProgress();
          setProgress(100);setPhase('World ready.');setBuildSteps(s=>[...s,'World ready.'].slice(-6));
          setConcept('');setSrcInfo(null);setSrcErr('');
          jobRef.current=null;abortRef.current=null;
          setTimeout(()=>{setBuilding(false);onCreated(sd.world)},250);
        }else if(sd.status==='failed'||sd.status==='cancelled'){
          throw new Error(sd.error||'Build failed.');
        }
      }
    }catch(e){
      clearBuildProgress();
      if(e.name==='AbortError'){setBuilding(false);setPhase('Build stopped.');setProgress(0);return}
      var msg=e.message||String(e);
      if(/failed to fetch/i.test(msg))msg='Could not reach the builder API. Restart the WorldGen server so the live build-progress endpoints are loaded, then retry.';
      setError(msg);setPhase('Build failed.');setProgress(0);setBuilding(false);
    }
  };
  const setBaseline=async()=>{
    if(!baselineSetId)return;
    const w=resetWorlds.find(x=>x.id===baselineSetId);
    const label=w?(w.name||w.title||(w.concept||'').slice(0,70)||w.id):baselineSetId;
    if(!confirm('Set the current state of "'+label+'" as its baseline?\n\nThis snapshot becomes the restore point. Any previous baseline is archived automatically.'))return;
    setError(null);
    try{
      const r=await fetch(API+'/worlds/'+encodeURIComponent(baselineSetId)+'/baseline',{method:'POST',headers:{'Content-Type':'application/json'}});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.detail||d.error||'Server error '+r.status);
      fetch(API+'/worlds').then(r2=>r2.json()).then(d2=>setResetWorlds(Array.isArray(d2.worlds)?d2.worlds.filter(Boolean):[])).catch(()=>{});
      alert('Baseline set for "'+label+'" — '+d.npcs+' NPCs, '+d.locations+' locations, '+d.timeline+' timeline, '+(d.factions||0)+' factions.');
    }catch(e){setError(e.message||String(e))}
  };
  const restoreBaseline=async()=>{
    if(!resetId)return;
    const w=resetWorlds.find(x=>x.id===resetId);
    const label=w?(w.name||w.title||(w.concept||'').slice(0,70)||w.id):resetId;
    if(!confirm('RESTORE BASELINE for "'+label+'"?\n\nThis discards all changes since the baseline was set and reverts the world to its saved baseline state.\n\nA safety backup is saved automatically.\nThis cannot be undone from the UI.\n\nContinue?'))return;
    setError(null);setMode('reset');setBuilding(true);setPhase('Restoring baseline...');setProgress(50);
    try{
      const r=await fetch(API+'/worlds/'+encodeURIComponent(resetId)+'/reset',{method:'POST',headers:{'Content-Type':'application/json'}});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.detail||d.error||'Server error '+r.status);
      setProgress(100);setPhase('Baseline restored.');
      setTimeout(()=>{setBuilding(false);setMode('build');onCreated(d.world)},400);
    }catch(e){setBuilding(false);setMode('build');setProgress(0);setError(e.message||String(e))}
  };
  const closeModal=()=>{
    const jobId=jobRef.current;
    jobRef.current=null;
    if(jobId)fetch(API+'/worlds/build/'+encodeURIComponent(jobId),{method:'DELETE'}).catch(()=>{});
    if(abortRef.current)abortRef.current.abort();
    abortRef.current=null;
    clearBuildProgress();
    setBuilding(false);setPhase('');setProgress(0);setBuildSteps([]);setLiveLogs([]);
    onClose();
  };
  if(!open)return null;
  return(
    <div className="wg-modal-overlay" onClick={e=>{if(e.target===e.currentTarget)closeModal()}}><div className="wg-modal wg-character-modal wg-polished-modal" onClick={e=>e.stopPropagation()}>
      {building?(<div style={{textAlign:'center',padding:'40px 20px'}}><div className="wg-spinner"/><h2 style={{fontFamily:"'Instrument Serif',serif",fontSize:24}}>{mode==='reset'?'Restoring Baseline':'Building World'}</h2><div className="wg-gen-percent">{progress}%</div><div className="wg-progress"><div className="wg-progress-fill" style={{width:progress+'%'}}/></div><div className="wg-gen-msg">{phase}<br/>Internal retries enabled: {retries}. Large builds can take several minutes and are checkpointed on the server.</div>{buildSteps.length>0&&<div style={{margin:'16px auto 0',maxWidth:420,textAlign:'left',fontSize:12,lineHeight:1.6,color:'var(--text-secondary)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 12px',background:'rgba(4,5,8,.48)'}}>{buildSteps.map((s,i)=><div key={i} style={{display:'flex',gap:8}}><span style={{color:'#22c55e'}}>✓</span><span>{s}</span></div>)}</div>}{liveLogs.length>0&&<div style={{margin:'14px auto 0',maxWidth:520,maxHeight:220,overflow:'auto',textAlign:'left',fontFamily:"'JetBrains Mono',monospace",fontSize:11,lineHeight:1.45,color:'#cbd5e1',border:'1px solid rgba(34,197,94,.24)',borderRadius:10,padding:'10px 12px',background:'rgba(4,5,8,.72)',boxShadow:'inset 0 0 12px rgba(34,197,94,.08)'}}>{liveLogs.slice(-40).map((line,i)=><div key={i} style={{whiteSpace:'pre-wrap',overflowWrap:'anywhere',color:/[✗╳]|failed|error|FATAL/i.test(line)?'#fca5a5':/[✓]|World written|complete/i.test(line)?'#86efac':'#cbd5e1'}}>{line}</div>)}</div>}<div className="wg-modal-actions" style={{justifyContent:'center',marginTop:20}}><button className="wg-btn" onClick={closeModal}>Stop</button></div></div>):(
        <><div className="wg-form-hero"><div className="wg-form-hero-icon">⚙️</div><div><h2>Build World</h2><p>Generate a full world with source-aware data, checkpoints, retries, and final repair before saving.</p></div></div>
        <div className="wg-build-kpis"><div className="wg-build-kpi">Checkpoints</div><div className="wg-build-kpi">Repair pass</div><div className="wg-build-kpi">Large cast</div></div>
        <div className="wg-field"><label>Concept</label><textarea className="wg-input" placeholder="A 1980s working-class Leeds estate where every doorway has history..." value={concept} onChange={e=>setConcept(e.target.value)} rows={3}/></div>
        <div className="wg-field"><label>Source PDF (optional - world is built from this instead of pure LLM)</label><input ref={srcInputRef} type="file" accept="application/pdf,.pdf" style={{display:'none'}} onChange={e=>{const f=e.target.files&&e.target.files[0];attachSource(f);e.target.value='';}}/><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}><input type="text" value={srcUrl} placeholder="...or paste a URL (Wikipedia, etc.)" onChange={e=>setSrcUrl(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();fetchSourceUrl();}}} disabled={srcBusy} style={{flex:'1 1 240px',minWidth:200,padding:'4px 8px',background:'rgba(0,0,0,.35)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',fontSize:12}}/><input type="text" value={srcYear} placeholder="Year (e.g. 1987)" onChange={e=>setSrcYear(e.target.value.replace(/[^0-9]/g,'').slice(0,4))} title="Optional TMDB year hint - locks cast lookup to the right film/show (Hellraiser 1987 vs 2022 etc.)" style={{width:96,padding:'4px 8px',background:'rgba(0,0,0,.35)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',fontSize:12}}/><button type="button" className="wg-btn" disabled={srcBusy||!srcUrl.trim()} onClick={fetchSourceUrl}>{srcBusy?'Fetching...':'Fetch URL'}</button></div><div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}><button type="button" className="wg-btn" disabled={srcBusy} onClick={()=>srcInputRef.current&&srcInputRef.current.click()}>{srcBusy?'Reading PDF...':(srcInfo?'Replace PDF':'Attach PDF')}</button>{srcInfo&&<span style={{fontSize:12,color:srcInfo.textLen>200?'#86efac':'#fca5a5'}}>{srcInfo.title} - {Number(srcInfo.textLen||0).toLocaleString()} chars{srcInfo.textLen<=200?' (no text layer - scanned PDF?)':''}</span>}{srcInfo&&<button type="button" className="wg-btn" style={{borderColor:'var(--danger)',color:'var(--danger)'}} onClick={()=>{setSrcInfo(null);setSrcErr('');}}>Clear</button>}</div>{srcErr&&<div style={{fontSize:12,color:'#fca5a5',marginTop:4}}>{srcErr}</div>}</div><div className="wg-field"><label>Builder Provider</label><div className="wg-providers">{BUILD_PROVIDERS.map(p=>(<div key={p.id} className={'wg-provider-chip'+(prov===p.id?' active':'')} onClick={()=>{setProv(p.id);setModel(p.models[0])}} style={prov===p.id?{borderColor:p.color,background:p.color+'15'}:{}}><span>{p.icon}</span> {p.label}</div>))}</div></div>
        <div className="wg-field"><label>Model</label><select className="wg-model-select" value={model} onChange={e=>setModel(e.target.value)}>{provObj.models.map(m=><option key={m} value={m}>{m}</option>)}</select></div>
        <div className="wg-build-grid">
          <div className="wg-field"><label>NPCs</label><input className="wg-input" type="number" min="1" max="150" value={npcs} onChange={e=>setNpcs(e.target.value)}/></div>
          <div className="wg-field"><label>Batch Size</label><input className="wg-input" type="number" min="1" max="8" value={batchSize} onChange={e=>setBatchSize(e.target.value)}/></div>
          <div className="wg-field"><label>Locations</label><input className="wg-input" type="number" min="3" max="80" value={locations} onChange={e=>setLocations(e.target.value)}/></div>
          <div className="wg-field"><label>Timeline</label><input className="wg-input" type="number" min="1" max="40" value={timelineEvents} onChange={e=>setTimelineEvents(e.target.value)}/></div>
          <div className="wg-field"><label>Retries</label><input className="wg-input" type="number" min="1" max="8" value={retries} onChange={e=>setRetries(e.target.value)}/></div>
        </div>
        {error&&<div className="wg-error-box"><strong>Build failed.</strong><br/>{error}<div style={{marginTop:10}}><button className="wg-btn" onClick={runBuild} disabled={!concept.trim()||srcBusy}>Retry Build</button></div></div>}
        <div className="wg-modal-actions"><button className="wg-btn" onClick={closeModal}>Cancel</button><button className="wg-btn wg-btn-primary" onClick={runBuild} disabled={!concept.trim()||srcBusy}>Build World</button></div>
        <div style={{borderTop:'1px solid var(--border)',margin:'24px 0 0',paddingTop:20}}/>
        <h2>Baseline</h2>
        <div className="wg-build-note"><strong>Set Baseline</strong> saves the current state of a world as its restore point. Previous baselines are archived automatically.<br/><br/><strong>Restore Baseline</strong> reverts a world to its saved baseline. All changes since the baseline (NPC edits, enhancements, manual tweaks) are discarded. A safety backup is always created first.</div>
        <h3 style={{margin:'18px 0 8px',fontSize:15,fontFamily:"'Instrument Serif',serif"}}>Set Baseline</h3>
        <div className="wg-field"><label>World</label><select className="wg-model-select" value={baselineSetId} onChange={e=>setBaselineSetId(e.target.value)}><option value="">Select a world...</option>{resetWorlds.map(w=><option key={w.id} value={w.id}>{(w.hasBaseline?'★ ':'')+(w.name||w.title||(w.concept||'').slice(0,70)||w.id)}</option>)}</select></div>
        <div className="wg-modal-actions"><button className="wg-btn wg-btn-primary" disabled={!baselineSetId} onClick={setBaseline}>Set current state as baseline</button></div>
        <h3 style={{margin:'18px 0 8px',fontSize:15,fontFamily:"'Instrument Serif',serif"}}>Restore Baseline</h3>
        {resetWorlds.filter(w=>w.hasBaseline).length===0?(<div className="wg-build-note" style={{color:'var(--text-secondary)',fontStyle:'italic'}}>No protected worlds yet — set a baseline on a customised world to enable restore.</div>):(<><div className="wg-field"><label>World</label><select className="wg-model-select" value={resetId} onChange={e=>setResetId(e.target.value)}><option value="">Select a world...</option>{resetWorlds.filter(w=>w.hasBaseline).map(w=><option key={w.id} value={w.id}>{w.name||w.title||(w.concept||'').slice(0,70)||w.id}</option>)}</select></div><div className="wg-modal-actions"><button className="wg-btn" style={{borderColor:'var(--danger)',color:'var(--danger)'}} disabled={!resetId} onClick={restoreBaseline}>Restore baseline</button></div></>)}
        <div className="wg-modal-actions" style={{marginTop:8}}><button className="wg-btn" onClick={closeModal}>Close</button></div></>
      )}</div></div>);
}

function PackBuilderView(){
  const[packs,setPacks]=useState([]);
  const[selected,setSelected]=useState('');
  const[run,setRun]=useState(null);
  const[p1,setP1]=useState(false);
  const[p2,setP2]=useState(false);
  const[p3,setP3]=useState(true);
  const[error,setError]=useState('');
  const[busy,setBusy]=useState(false);
  const[showLog,setShowLog]=useState(false);
  const loadPacks=useCallback(async()=>{
    try{
      const r=await fetch(API+'/pack-builder/packs');
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||('Server error '+r.status));
      setPacks(d.packs||[]);
    }catch(e){setError(e.message||String(e))}
  },[]);
  const pollStatus=useCallback(async()=>{
    try{
      const r=await fetch(API+'/pack-builder/status');
      const d=await r.json().catch(()=>({}));
      setRun(d.run||null);
    }catch{}
  },[]);
  useEffect(()=>{loadPacks();pollStatus();},[loadPacks,pollStatus]);
  useEffect(()=>{const t=setInterval(pollStatus,run?.running?3000:10000);return()=>clearInterval(t);},[pollStatus,run?.running]);
  useEffect(()=>{if(run&&!run.running)loadPacks();},[loadPacks,run?.running,run?.endedAt]);
  const doRun=async()=>{
    const phases=[];
    if(p1)phases.push(1);
    if(p2)phases.push(2);
    if(p3)phases.push(3);
    if(!phases.length){setError('Pick at least one phase.');return}
    setBusy(true);setError('');
    try{
      const body={phases};
      if(selected)body.pack=selected;
      const r=await fetch(API+'/pack-builder/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||('Server error '+r.status));
      setRun(d.run);
    }catch(e){setError(e.message||String(e))}
    finally{setBusy(false)}
  };
  const sel=packs.find(p=>p.dir===selected)||null;
  const running=!!run?.running;
  const srcColor=(s)=>(s==='llm'||s==='manual')?'#7dd3fc':s==='bank-fallback'?'#fbbf24':'#94a3b8';
  return(
    <div>
      <div className="wg-build-note" style={{marginTop:8}}>Run only the phases you need. Blank pack targets every pack, but audio fetch still skips packs that already meet file/theme coverage.</div>
      <div className="wg-field" style={{marginTop:14}}>
        <label>Pack ({packs.length} total)</label>
        <select className="wg-model-select" value={selected} onChange={e=>setSelected(e.target.value)} disabled={running}>
          <option value="">(all packs below thresholds)</option>
          {packs.map(p=>(
            <option key={p.dir} value={p.dir}>{p.dir} — {p.audioCount} files, {p.themeCount} themes, {p.themesSource}</option>
          ))}
        </select>
      </div>
      {sel&&(
        <div style={{display:'flex',flexWrap:'wrap',gap:14,alignItems:'center',fontSize:13,marginTop:8}}>
          <div><span className="wg-muted">Audio:</span> <strong>{sel.audioCount}</strong></div>
          <div><span className="wg-muted">Themes:</span> <strong>{sel.themeCount}</strong></div>
          <div><span className="wg-muted">Source:</span> <strong style={{color:srcColor(sel.themesSource)}}>{sel.themesSource}</strong></div>
          <div><span className="wg-muted">Bound worlds:</span> <strong>{(sel.worldIds||[]).length}</strong></div>
        </div>
      )}
      <div style={{display:'flex',flexWrap:'wrap',gap:10,fontSize:13,marginTop:14}}>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
          <input type="checkbox" checked={p1} onChange={e=>setP1(e.target.checked)} disabled={running}/>
          <span>P1: Build new packs (for newly added worlds)</span>
        </label>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
          <input type="checkbox" checked={p2} onChange={e=>setP2(e.target.checked)} disabled={running}/>
          <span>P2: Enhance bland themes (LLM)</span>
        </label>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
          <input type="checkbox" checked={p3} onChange={e=>setP3(e.target.checked)} disabled={running}/>
          <span>P3: Fetch missing audio (Freesound)</span>
        </label>
      </div>
      <div className="wg-modal-actions" style={{justifyContent:'flex-start',gap:10,marginTop:14}}>
        <button className="wg-btn wg-btn-primary" onClick={doRun} disabled={busy||running}>{running?'Running...':busy?'Starting...':'Run pipeline'}</button>
        <button className="wg-btn" onClick={loadPacks} disabled={busy}>Refresh</button>
        {run&&<button className="wg-btn" onClick={()=>setShowLog(s=>!s)}>{showLog?'Hide log':'Show log'}</button>}
      </div>
      {error&&<div className="wg-error-box" style={{marginTop:10,fontSize:12}}>{error}</div>}
      {run&&(
        <div className="wg-muted" style={{fontSize:12,marginTop:10}}>
          {run.running?'Running ':'Last run '}
          phases={(run.phases||[]).join(',')||'?'}
          {run.pack?' pack='+run.pack:' (all packs)'}
          {' started='+new Date(run.startedAt).toLocaleTimeString()}
          {run.endedAt?' ended='+new Date(run.endedAt).toLocaleTimeString():''}
          {typeof run.code==='number'?' exit='+run.code:''}
        </div>
      )}
      {showLog&&run&&(
        <pre style={{marginTop:10,maxHeight:280,overflow:'auto',background:'#0d1117',color:'#c9d1d9',padding:8,fontSize:11,lineHeight:1.4,borderRadius:4,border:'1px solid #1f2937'}}>
{(run.stdoutTail||'(no stdout yet)')+(run.stderrTail?('\n--- stderr ---\n'+run.stderrTail):'')}
        </pre>
      )}
    </div>
  );
}

function CheckDataModal({open,onClose,onUpdated,initialView='menu'}){
  const[view,setView]=useState(initialView||'menu');
  const[loading,setLoading]=useState(false);
  const[result,setResult]=useState(null);
  const[error,setError]=useState(null);
  const[expandedSections,setExpandedSections]=useState({repairs:true,errors:true,warnings:false,photos:false});
  const[orchestrator,setOrchestrator]=useState(null);
  const[orchestratorBusy,setOrchestratorBusy]=useState(false);
  const[orchestratorRunBusy,setOrchestratorRunBusy]=useState(false);
  const[orchestratorStatusBusy,setOrchestratorStatusBusy]=useState(false);
