<!DOCTYPE html>
<html>
<head>
<title>WorldGen Observatory</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-deep:#08090d;--bg-surface:#0f1118;--bg-card:#151821;--bg-elevated:#1c1f2e;--border:#242838;--text-primary:#e8eaf0;--text-secondary:#8b8fa3;--text-muted:#565a6e;--accent:#a78bfa;--accent-glow:rgba(167,139,250,0.15);--cyan:#64ffda;--cyan-glow:rgba(100,255,218,0.12);--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--radius:16px;--radius-sm:10px;--panel-surface:rgba(21,24,33,.85);--panel-surface-alt:rgba(15,17,24,.85);--panel-border-vibrant:rgba(100,255,218,.34);--panel-border-accent:rgba(167,139,250,.42);--panel-shadow:0 14px 34px rgba(0,0,0,.18),0 0 0 1px rgba(167,139,250,.05)}
html,body,#app{height:100%}
body{background:var(--bg-deep);color:var(--text-primary);font-family:'DM Sans',-apple-system,sans-serif;overflow:hidden;height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(167,139,250,0.05) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 90%,rgba(100,255,218,0.04) 0%,transparent 70%);pointer-events:none;z-index:0}
@media (max-width:980px) and (orientation:portrait),(hover:none) and (pointer:coarse) and (orientation:portrait){body.mobile-optimised{height:auto;min-height:100dvh;overflow:auto}body.mobile-optimised::before{display:none}body.mobile-optimised .topbar{backdrop-filter:none;box-shadow:none}body.mobile-optimised .grid{gap:10px;padding:10px}body.mobile-optimised .panel,body.mobile-optimised .card,body.mobile-optimised .gift-card{box-shadow:none;background-image:none!important}body.mobile-optimised .obs-dom-orbit .ring,body.mobile-optimised .react-glyph .ring,body.mobile-optimised .react-glyph .node,body.mobile-optimised .player-img-invis::after{animation:none!important}body.mobile-optimised .left-player-photo img,body.mobile-optimised .npc-tile-card img,body.mobile-optimised .resident-npc-card img,body.mobile-optimised .street-map-photo,body.mobile-optimised .street-map-bg{filter:none!important}body.mobile-optimised .conv-modal{width:calc(100vw - 16px);max-height:92dvh;border-radius:12px}body.mobile-optimised .conv-messages{padding:12px}body.mobile-optimised button{min-height:34px}body.mobile-optimised input,body.mobile-optimised select{min-height:36px;font-size:16px}}
@media (max-width:980px) and (orientation:landscape),(hover:none) and (pointer:coarse) and (orientation:landscape){body.mobile-optimised{height:100dvh;overflow:hidden}body.mobile-optimised .conv-modal{height:100dvh;width:100vw;max-height:none;border-radius:0}}
@media (max-width:980px) and (orientation:portrait),(hover:none) and (pointer:coarse) and (orientation:portrait){body.mobile-optimised{height:100dvh;overflow:hidden}body.mobile-optimised #app{visibility:hidden;pointer-events:none}body.mobile-optimised::after{content:'Only landscape';position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-deep);color:#facc15;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.14em;text-shadow:0 0 14px rgba(250,204,21,.42)}}
#app{display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg-deep)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
button{background:var(--bg-elevated);color:var(--text-secondary);border:1px solid var(--border);padding:7px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;border-radius:var(--radius-sm);transition:all .2s}
button:hover{background:var(--bg-card);border-color:var(--accent);color:var(--text-primary);box-shadow:0 0 20px var(--accent-glow)}
button.active,.tabs .active{background:var(--accent-glow);color:var(--text-primary);border-color:var(--accent)}
button.danger{color:var(--danger);border-color:#ef444444;background:#ef444408}
button.danger:hover{background:#ef444418;border-color:var(--danger);box-shadow:0 0 18px rgba(239,68,68,.16)}
input,select{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;border-radius:8px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.grid{display:flex;flex:1;min-height:0;overflow:hidden;padding:18px;gap:18px}
.grid.no-right .right{display:none!important}
.grid.community-quest-active .right{width:321px}
.left{width:260px;border:1px solid var(--panel-border-accent);border-radius:var(--radius);background:var(--panel-surface-alt);overflow:auto;flex-shrink:0;min-height:0;box-shadow:var(--panel-shadow);backdrop-filter:blur(18px)}
.center{flex:1;overflow:auto;padding:2px;min-height:0}
.center.community-bg{position:relative;padding:14px;border-radius:var(--radius);background:#08090d;isolation:isolate}
.center.community-bg::before{content:'';position:sticky;display:block;top:0;height:calc(100vh - 132px);margin-bottom:calc(-1 * (100vh - 132px));border-radius:var(--radius);background:linear-gradient(180deg,rgba(8,9,13,.36),rgba(8,9,13,.78)),url('/banner.png') center center/cover no-repeat;z-index:0;pointer-events:none}
.center.community-bg .observatory-heading-row,.center.community-bg .top-panels-row,.center.community-bg .panel{position:relative;z-index:1}
.center.community-bg .observatory-heading-row{z-index:80}
.center.community-bg .observatory-search{z-index:90}
.center.community-bg .panel{background-color:rgba(15,17,24,.74);backdrop-filter:blur(5px)}
.center.community-bg .community-ticker-panel{background:linear-gradient(180deg,rgba(8,16,23,.9),rgba(12,14,22,.84))}
.center.community-bg .cog-proof-panel{background:linear-gradient(180deg,rgba(6,12,16,.9),rgba(10,15,22,.84))}
.right{width:321px;border:1px solid var(--panel-border-accent);border-radius:var(--radius);background:var(--panel-surface-alt);overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;min-height:0;box-shadow:var(--panel-shadow);backdrop-filter:blur(18px)}
.feed-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto;cursor:grab;user-select:none}.feed-list.paused{cursor:default;border-left:2px solid #f59e0b33}
.live-feed-drawer{position:fixed;top:96px;right:0;bottom:16px;width:320px;z-index:120;background-color:rgba(15,17,24,.96);background-image:linear-gradient(180deg,rgba(3,7,18,.68),rgba(3,7,18,.96)),var(--wg-panel-bg-geography,var(--wg-panel-bg-economy,none));background-size:cover;background-position:center;background-blend-mode:multiply,normal;border:1px solid var(--panel-border-accent);border-right:0;border-radius:12px 0 0 12px;box-shadow:0 18px 44px rgba(0,0,0,.38),0 0 0 1px rgba(100,255,218,.06);backdrop-filter:blur(18px);display:flex;flex-direction:column;overflow:hidden;transform:translateX(206px);transition:transform .22s ease}
.live-feed-drawer:hover,.live-feed-drawer.pinned,.live-feed-drawer:focus-within{transform:translateX(0)}
.live-feed-drawer::before{content:'LIVE';position:absolute;left:0;top:50%;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center;padding:3px 8px;border:1px solid rgba(100,255,218,.35);border-radius:6px;background:rgba(4,6,9,.94);color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800;letter-spacing:.12em;box-shadow:0 0 12px rgba(100,255,218,.12)}
.live-feed-drawer .sh{padding:8px 14px 4px 28px}
.portal-live-feed-panel,.right.live-feed-right-panel{background-color:rgba(15,17,24,.92)!important;background-image:linear-gradient(180deg,rgba(3,7,18,.68),rgba(3,7,18,.96)),var(--wg-panel-bg-geography,var(--wg-panel-bg-economy,none))!important;background-size:cover!important;background-position:center!important;background-blend-mode:multiply,normal!important}
.portal-live-feed-panel{height:min(420px,42vh);display:flex;flex-direction:column;overflow:hidden;padding:0!important}
.portal-live-feed-panel .sh{padding:8px 14px 4px}
.sh{font-family:'JetBrains Mono',monospace;font-size:10px;color:#dbeafe;text-transform:uppercase;letter-spacing:.12em;font-weight:800;padding:12px 14px 8px;text-shadow:0 0 12px rgba(96,165,250,.18)}
.sec{border-bottom:1px solid var(--border)}
.left-player-panel{height:auto;flex:none;overflow:hidden;border:1px solid rgba(100,255,218,.22);border-radius:12px;margin:8px 8px 12px;background:var(--bg-surface);background-image:linear-gradient(180deg,rgba(100,255,218,.035),transparent);position:sticky;top:8px;left:0;z-index:6;box-shadow:var(--panel-shadow)}
.left .sh{font-size:8px!important;padding:9px 10px 6px}
.left .sec-head{padding:9px 10px 6px;gap:6px}
.left .panel-swap{gap:4px}
.left .panel-swap-label{font-size:6px}
.left .panel-swap-btn{width:26px;height:14px}
.left .panel-swap-btn::before{top:1px;left:1px;width:10px;height:10px}
.left .panel-swap-btn.on::before{transform:translateX(12px)}
.left .panel-swap-btn::after{font-size:6px}
.left .action-btn,.left .npc-btn,.left .pill{font-size:9px!important}
.left .speech-word{min-width:28px;height:18px;padding:0 5px;font-size:8px}
.left .card{padding:9px;border-radius:8px;margin:0 0 6px;box-shadow:0 8px 18px rgba(0,0,0,.24),0 0 0 1px rgba(100,255,218,.04)}
.left .card:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.24),0 0 16px rgba(100,255,218,.08)}
.left .resident-npc-card,.left .npc-tile-card,.left .npc-list-tile{background-size:14px 14px;background-position:0 0,7px 7px}
.left .resident-npc-card img,.left .npc-tile-card img{border-radius:8px 8px 0 0!important}
.left-player-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.left-player-photo{width:100%;height:112px;border-radius:6px;overflow:hidden;border:1px solid rgba(100,255,218,.22);background:#0d0d10;flex:none;position:relative}
.left-player-photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.robe-player-photo img{filter:saturate(.82) brightness(.72) contrast(1.08)}
.robe-player-photo::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 18%,transparent 0 28%,rgba(0,0,0,.82) 29% 47%,transparent 48%),linear-gradient(90deg,rgba(0,0,0,.78),transparent 24% 76%,rgba(0,0,0,.78))}
.robe-player-photo::after{content:'';position:absolute;left:9%;right:9%;bottom:-4px;height:48%;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(8,8,12,.18),rgba(0,0,0,.96));clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);box-shadow:0 0 18px rgba(0,0,0,.7)}
.left-player-details{display:grid;gap:2px;line-height:1.2;min-height:0}
.left-player-name{font-size:8px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.left-player-money{font-family:'JetBrains Mono',monospace;font-size:7px;color:#f59e0b}
.left-player-meta{font-size:6px;color:#888;line-height:1.2;overflow-wrap:anywhere}
.left-player-appearance{font-size:6px;color:#a78bfa;line-height:1.2;overflow-wrap:anywhere}
.left-player-departure{font-size:5px;color:#f59e0b;line-height:1.2;overflow-wrap:anywhere}
.card{padding:14px;background:var(--panel-surface);border:1px solid var(--panel-border-vibrant);border-radius:var(--radius-sm);margin:0 0 10px;cursor:pointer;text-align:left;position:relative;transition:all .25s;box-shadow:var(--panel-shadow);backdrop-filter:blur(16px)}
.card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.25),0 0 24px var(--cyan-glow)}
.resident-npc-card,.npc-tile-card,.portal-person-card:not(.player-card),.npc-list-tile{background-image:linear-gradient(45deg,rgba(255,255,255,.055) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.055) 75%,rgba(255,255,255,.055)),linear-gradient(45deg,rgba(255,255,255,.055) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.055) 75%,rgba(255,255,255,.055));background-size:18px 18px;background-position:0 0,9px 9px}
.resident-npc-card,.npc-tile-card{box-shadow:0 10px 22px rgba(0,0,0,.28),0 0 0 1px rgba(100,255,218,.06);background-color:rgba(2,3,6,.96);overflow:hidden}
.npc-list-tile{background-color:rgba(21,24,33,.45)}
.npc-unavailable-static{position:relative;opacity:.78;filter:grayscale(.42) contrast(1.08);border-color:rgba(148,163,184,.18)!important;background:#040609!important}
.npc-unavailable-static::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(34,211,238,.05) 0 2px,rgba(244,114,182,.035) 2px 4px,transparent 4px 7px);mix-blend-mode:screen;opacity:.42;animation:npcStaticSweep .22s steps(2,end) infinite}
.npc-unavailable-static::after{content:'NO SIGNAL';position:absolute;left:8px;top:8px;z-index:3;padding:2px 6px;border:1px solid rgba(239,68,68,.45);border-radius:4px;background:rgba(4,6,9,.78);color:#fca5a5;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.14em;text-shadow:1px 0 rgba(34,211,238,.65),-1px 0 rgba(244,114,182,.55);pointer-events:none;animation:npcSignalJitter 1.4s steps(1,end) infinite}
.npc-unavailable-static img{filter:grayscale(1) contrast(1.35) brightness(.58) saturate(.45)}
@keyframes npcStaticSweep{0%{transform:translate(0,0);opacity:.3;background-position:0 0,0 0}50%{transform:translate(-1px,1px);opacity:.52;background-position:0 4px,6px 0}100%{transform:translate(1px,-1px);opacity:.38;background-position:0 -3px,-4px 0}}
@keyframes npcSignalJitter{0%,100%{transform:translate(0,0)}18%{transform:translate(1px,-1px)}19%{transform:translate(-2px,1px)}20%{transform:translate(0,0)}58%{transform:translate(-1px,0)}59%{transform:translate(2px,1px)}60%{transform:translate(0,0)}}
.portal-travel-static{position:fixed;inset:0;z-index:9998;pointer-events:none;background:rgba(4,6,9,.82);animation:portalStaticIn .3s ease-out forwards}
.portal-travel-static::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(34,211,238,.04) 0 2px,rgba(244,114,182,.03) 2px 4px,transparent 4px 7px);mix-blend-mode:screen;opacity:.5;animation:npcStaticSweep .18s steps(2,end) infinite}
.portal-travel-static::after{content:'CROSSING PORTAL';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:8px 20px;border:1px solid rgba(167,139,250,.55);border-radius:6px;background:rgba(4,6,9,.92);color:#c4b5fd;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;letter-spacing:.18em;text-shadow:1px 0 rgba(34,211,238,.65),-1px 0 rgba(244,114,182,.55);animation:npcSignalJitter 1.4s steps(1,end) infinite}
.portal-travel-static.blocked::after{content:'SIGNAL BLOCKED';border-color:rgba(239,68,68,.62);color:#fca5a5}
@keyframes portalStaticIn{from{opacity:0}to{opacity:1}}
.portal-block-pulse{animation:portalBlockPulse .42s ease-out}
@keyframes portalBlockPulse{0%{transform:translateX(0) scale(1);box-shadow:0 0 0 rgba(239,68,68,0)}20%{transform:translateX(-3px) scale(1.02);box-shadow:0 0 22px rgba(239,68,68,.38)}45%{transform:translateX(3px) scale(1.02)}70%{transform:translateX(-2px) scale(1.01)}100%{transform:translateX(0) scale(1)}}
.player-card{border-color:rgba(100,255,218,.35);background:linear-gradient(180deg,rgba(100,255,218,.05),rgba(255,255,255,.02))}
.player-card:hover{border-color:var(--cyan);box-shadow:0 12px 32px rgba(0,0,0,.25),0 0 24px var(--cyan-glow)}
@keyframes mysticPulse{0%,100%{box-shadow:0 0 8px rgba(167,139,250,.2),inset 0 0 6px rgba(167,139,250,.08);border-color:rgba(167,139,250,.35)}50%{box-shadow:0 0 22px rgba(167,139,250,.45),inset 0 0 14px rgba(167,139,250,.18);border-color:rgba(167,139,250,.65)}}
.mystic-invis{animation:mysticPulse 2.2s ease-in-out infinite;border:1px solid rgba(167,139,250,.35);border-radius:12px}
.mystic-sand-panel{background:linear-gradient(180deg,rgba(10,12,20,.82),rgba(6,8,16,.78)),url('/hellrback.png')!important;background-size:cover!important;background-position:center!important}
.player-img-invis{position:relative;overflow:hidden}.player-img-invis img{opacity:0!important}.player-img-invis::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 40%,rgba(167,139,250,.18) 0%,transparent 60%);border:2px dashed rgba(167,139,250,.4);border-radius:6px;animation:ghostPulse 2.5s ease-in-out infinite}
@keyframes ghostPulse{0%,100%{border-color:rgba(167,139,250,.25);opacity:.6}50%{border-color:rgba(167,139,250,.6);opacity:1}}
.panel{background:var(--panel-surface);border:1px solid var(--panel-border-vibrant);border-radius:var(--radius-sm);padding:14px;margin:10px 0;box-shadow:var(--panel-shadow);backdrop-filter:blur(16px)}
.wg-entry-timeline-panel{position:relative;overflow:hidden;background-color:#05070b!important;background-size:cover!important;background-position:center!important;background-blend-mode:multiply,normal!important;border-color:rgba(125,211,252,.34)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 18px 34px rgba(0,0,0,.38)}
.wg-entry-timeline-panel::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 12%,rgba(125,211,252,.20),transparent 48%),linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.38),rgba(0,0,0,.78));z-index:0;pointer-events:none}
.wg-entry-timeline-panel>*{position:relative;z-index:1}
.wg-entry-timeline-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.wg-entry-timeline-kicker{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#7dd3fc;font-weight:800}
.wg-entry-timeline-title{font-size:15px;font-weight:700;color:#fff;line-height:1.2}

.wg-entry-timeline-meta{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#86efac;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wg-entry-timeline-event-title{color:#4ade80;font-weight:700;margin-bottom:3px}
.wg-entry-timeline-desc{color:#dbeafe}
.wg-entry-timeline-rumour{margin-top:6px;color:#8b8fa3}
.visitors-panel{background-color:rgba(18,21,29,.85)!important;background-image:linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.04) 75%,rgba(255,255,255,.04)),linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.04) 75%,rgba(255,255,255,.04))!important;background-size:16px 16px!important;background-position:0 0,8px 8px!important}
.cog-proof-panel{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;background:linear-gradient(180deg,rgba(6,12,16,.96),rgba(10,15,22,.92));border-color:#22d3ee33;box-shadow:inset 0 0 0 1px rgba(100,255,218,.04),0 0 28px rgba(34,211,238,.06)}.cog-proof-title{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:.18em;margin-bottom:7px;text-shadow:0 0 10px rgba(100,255,218,.28)}.cog-proof-stats{display:flex;gap:12px;flex-wrap:wrap;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;color:#a7f3d0}.cog-proof-body{max-height:264px;overflow-y:auto;overflow-x:hidden;margin-top:10px;padding-right:4px}.cog-proof-row{padding:7px 0;border-top:1px solid #22d3ee22;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;line-height:1.45;color:#cbd5e1;letter-spacing:.01em}.cog-proof-kind{display:inline-block;margin-right:7px;color:#f87171;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.cog-proof-detail{margin-top:3px;color:#7dd3fc;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;line-height:1.45}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:9px}
.bar{display:inline-block;width:50px;height:5px;background:var(--bg-elevated);border-radius:999px;overflow:hidden;vertical-align:middle}

function getPortalTypingKey(){

  // Space wins outright (it has lots of unique IP names). Explicit fantasy IPs are checked

  // of "witch". Vintage (gothic mansion / Victorian) is checked before generic fantasy because
  // Addams / Dracula are more specifically "old typewriter with bell" than "wizard magic".
  if(isSpaceTypeWorld())return 'world.alien.typing';
  if(isFantasyIpWorld())return 'world.fantasy.typing';
  if(isHorrorTypeWorld())return 'world.horror.typing';
  if(isVintageGothicTypeWorld())return 'world.vintage.typing';

function closeGameConfirm(choice){
  var active=GAME_CONFIRM_ACTIVE;
  var el=document.getElementById('game-confirm-overlay');
  if(el)el.remove();
  document.removeEventListener('keydown',gameConfirmKeydown);
  GAME_CONFIRM_ACTIVE=null;
  if(choice&&active&&typeof active.onYes==='function')active.onYes();
  if(!choice&&active&&typeof active.onNo==='function')active.onNo();
}
function dismissGameConfirm(){
  var el=document.getElementById('game-confirm-overlay');
  if(el)el.remove();
  document.removeEventListener('keydown',gameConfirmKeydown);
  GAME_CONFIRM_ACTIVE=null;
}
function gameConfirmKeydown(ev){
  if(!GAME_CONFIRM_ACTIVE)return;
  if(ev.key==='Escape'||/^[Nn]$/.test(ev.key)){ev.preventDefault();closeGameConfirm(false)}
  if(/^[Yy]$/.test(ev.key)){ev.preventDefault();closeGameConfirm(true)}
}
function showGameConfirm(message,onYes,onNo,title){
  dismissGameConfirm();
  GAME_CONFIRM_ACTIVE={onYes:onYes,onNo:onNo};
  var el=document.createElement('div');
  el.id='game-confirm-overlay';
  el.className='game-confirm-overlay';
  el.innerHTML='<div class="game-confirm-panel"><div class="game-confirm-title">'+esc(title||'Yes or No')+'</div><div class="game-confirm-message">'+esc(message||'Continue?')+'</div><div class="game-confirm-actions"><button class="action-btn drama-lead-action" onclick="closeGameConfirm(true)">Yes</button><button class="action-btn" style="color:#ef4444;border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.08)" onclick="closeGameConfirm(false)">No</button></div></div>';
  document.body.appendChild(el);
  document.addEventListener('keydown',gameConfirmKeydown);
}

function showBlockedPortalFeedback(portalId,message){

  BLOCKED_PORTAL_PULSE_ID=(portalId||'')+':'+Date.now();

function portalQuestTravel(worldId,portalId,skipApproach){
  if(!S||!S.id){portalLog('Quest','Start or load a session first.');renderCenter();return}
  var qd=questData(),q=qd.quest,portals=qd.portals||[];
  if(q&&!skipApproach){
    var currentWorldId=questViewWorldId(q);
    var currentLocationId=questViewLocationId(q);
    var currentPortal=portals.find(function(p){return p.fromWorldId===currentWorldId});
    if(currentPortal&&currentLocationId!==currentPortal.locationId){
      var direct=(SD&&SD.connectedLocations||[]).find(function(l){return l&&l.id===currentPortal.locationId});
      if(direct){
        setLocationLoading(currentPortal.locationId);
        portalLog('Quest','Moving to '+(currentPortal.locationName||'the local portal')+'...');renderCenter();
        showPortalStatic();
        api('/api/sessions/'+S.id+'/move',{method:'POST',body:llmBody({locationId:currentPortal.locationId})}).then(function(r){
          if(r.error){hidePortalStatic();portalLog('Quest',r.error);renderCenter();clearLocationLoading(currentPortal.locationId);return}
          if(r.session){S=r.session;if(SD)SD.session=r.session}
          refresh(function(){clearLocationLoading(currentPortal.locationId);portalQuestTravel(worldId,portalId,true)}).finally(function(){clearLocationLoading(currentPortal.locationId)});
        }).catch(function(e){hidePortalStatic();portalLog('Quest',String(e.message||e));renderCenter();clearLocationLoading(currentPortal.locationId)});
        return;
      }
      portalLog('Quest','Reach '+(currentPortal.locationName||'the local portal')+' before using quest portals.');
      renderCenter();
      return;
    }
  }
  setLocationLoading('quest:'+portalId);
  portalLog('Quest','Crossing quest portal...');renderCenter();
  showPortalStatic();
  api('/api/sessions/'+S.id+'/quest/travel',{method:'POST',body:JSON.stringify({worldId:worldId,portalId:portalId})}).then(function(r){
    hidePortalStatic();
    return refreshAfterQuest(r,'Quest portal crossed.');
  }).catch(function(e){hidePortalStatic();portalLog('Quest',String(e.message||e));renderCenter()}).finally(function(){clearLocationLoading('quest:'+portalId)});
}
function portalQuestBlocked(worldId,portalId){
  if(!S||!S.id){portalLog('Quest','Start or load a session first.');renderCenter();return}
  showBlockedPortalFeedback(portalId,'Checking blocked portal...');
  renderCenter();
  api('/api/sessions/'+S.id+'/quest/travel',{method:'POST',body:JSON.stringify({worldId:worldId,portalId:portalId})}).then(function(r){
    refreshAfterQuest(r,'Quest portal crossed.');
  }).catch(function(e){
    var msg=String(e.message||e);
    if(e&&e.blocked&&e.blocked.message)msg=e.blocked.message;
    portalLog('Quest',msg);
    showBlockedPortalFeedback(portalId,msg);
    if(e&&e.quest)SD.quest=e.quest;
    if(e&&e.session){S=e.session;if(SD)SD.session=e.session}
    renderCenter();
  });
}
function questInvitesData(){
  var status=SD&&SD.quest||{};
  return (S&&S.questInvites)||(SD&&SD.questInvites)||status.invites||[];
}
function portalResolvePlayer(query){
  var q=portalNorm(query);if(!q)return null;
  var seen={},pool=[];
  (playersHereNow()||[]).concat(worldCharacters()||[]).forEach(function(p){if(p&&p.sessionId&&!seen[p.sessionId]){seen[p.sessionId]=true;pool.push(p)}});
  var exact=pool.find(function(p){return portalNorm(p.playerName)===q||portalNorm(p.sessionId)===q});if(exact)return exact;
  return pool.find(function(p){var n=portalNorm(p.playerName);return n.indexOf(q)>=0||q.indexOf(n)>=0})||null;
}
function portalQuestInviteByName(name){
  var target=portalResolvePlayer(name);
  if(!target){portalLog('Quest','No character matches '+name+'.');renderCenter();return}
  portalLog('Quest','Sending quest invite to '+target.playerName+'.');
  portalQuestPost('/quest/invite',{targetSessionId:target.sessionId},'Quest invite sent.');
}

function markQuestPanelScrollActive(){QUEST_PANEL_SCROLL_ACTIVE_UNTIL=Date.now()+8000}
function scrollPortalMonitorWheel(e,el){
  if(!el)return;
  el.scrollTop=(el.scrollTop||0)+(e&&e.deltaY?e.deltaY:0);
  if(el.scrollHeight>el.clientHeight){
    if(e&&e.preventDefault)e.preventDefault();
    if(e&&e.stopPropagation)e.stopPropagation();
    return false;
  }
}
function scrollQuestPanelWheel(e,el,kind){
  if(!el)return;
  var before=el.scrollTop||0;
  el.scrollTop=before+(e&&e.deltaY?e.deltaY:0);
  if(kind==='world')WORLD_QUEST_PANEL_SCROLL_TOP=el.scrollTop||0;
  else if(kind==='adventure')ADVENTURE_PANEL_SCROLL_TOP=el.scrollTop||0;
  else QUEST_PANEL_SCROLL_TOP=el.scrollTop||0;
  markQuestPanelScrollActive();
  if(el.scrollHeight>el.clientHeight){
    if(e&&e.preventDefault)e.preventDefault();
    if(e&&e.stopPropagation)e.stopPropagation();
    return false;
  }
}
function captureQuestPanelScroll(){
  // Only overwrite saved scroll if scrollTop > 0. Prevents a freshly-rebuilt
  // panel (scrollTop=0 after DOM rewrite) from clobbering the real saved value.
  // User-initiated scrolling updates these vars directly via onscroll handlers,
  // including legitimate scrolls back to 0.
  var qp=document.getElementById('quest-panel-scroll');
  if(qp){var s=qp.scrollTop||0;if(s>0)QUEST_PANEL_SCROLL_TOP=s}
  var wqp=document.getElementById('worldquest-panel-scroll');
  if(wqp){var ws=wqp.scrollTop||0;if(ws>0)WORLD_QUEST_PANEL_SCROLL_TOP=ws}
  var ap=document.getElementById('adventure-panel-scroll');
  if(ap){var as_=ap.scrollTop||0;if(as_>0)ADVENTURE_PANEL_SCROLL_TOP=as_}
}
function restoreQuestPanelScroll(){
  function apply(){
    var qp=document.getElementById('quest-panel-scroll');
    if(qp)qp.scrollTop=QUEST_PANEL_SCROLL_TOP||0;
    var wqp=document.getElementById('worldquest-panel-scroll');
    if(wqp)wqp.scrollTop=WORLD_QUEST_PANEL_SCROLL_TOP||0;
    var ap=document.getElementById('adventure-panel-scroll');
    if(ap)ap.scrollTop=ADVENTURE_PANEL_SCROLL_TOP||0;
  }
  requestAnimationFrame(function(){apply();if(Date.now()>=QUEST_PANEL_SCROLL_ACTIVE_UNTIL){setTimeout(apply,40);setTimeout(apply,140)}});
}

function joinWorldQuest2P(questId){
  if(!S||!S.id)return;
  api('/api/sessions/'+S.id+'/world-quests/'+questId+'/request-join',{method:'POST',body:JSON.stringify({})}).then(function(r){
    if(r.status==='accepted'){
      if(r.session){S=r.session;if(SD)SD.session=r.session}
      addFeed('quest','World Quest joined: '+((r.worldQuest&&r.worldQuest.title)||''));
      connectCoopWs();
      refresh(function(){render()});
      return;
    }
    addFeed('quest','Join request sent. Waiting for the World Quest player.');
    if(r.request&&r.request.id)pollWorldQuestJoinRequest(questId,r.request.id,Date.now());
  }).catch(function(e){addFeed('error',String(e.message||e))});
}
function pollWorldQuestJoinRequest(questId,requestId,startedAt){
  if(!S||!S.id||Date.now()-startedAt>90000)return;
  setTimeout(function(){
    api('/api/sessions/'+S.id+'/world-quests/'+questId+'/join-requests/'+requestId).then(function(r){
      if(r.status==='accepted'){
        if(r.session){S=r.session;if(SD)SD.session=r.session}
        addFeed('quest','World Quest join accepted');
        connectCoopWs();
        refresh(function(){render();if(TALKNPC)renderConvModal()});
      }else if(r.status==='declined'){
        addFeed('quest','World Quest join refused');
        refresh(function(){render();if(TALKNPC)renderConvModal()});
      }else pollWorldQuestJoinRequest(questId,requestId,startedAt);
    }).catch(function(){pollWorldQuestJoinRequest(questId,requestId,startedAt)});
  },2000);
}

function computeAdventurerRank(xp){
  var safeXp=Math.max(0,Math.floor(xp||0));
  var idx=0;
  for(var i=ADV_RANKS.length-1;i>=0;i--){ if(safeXp>=ADV_RANKS[i].xp){idx=i;break;} }
  var cur=ADV_RANKS[idx], isMaxed=idx===ADV_RANKS.length-1, next=isMaxed?cur:ADV_RANKS[idx+1];
  var span=isMaxed?1:(next.xp-cur.xp);
  return {level:cur.level, rank:cur.name, xp:safeXp, rankXp:cur.xp, nextRankXp:next.xp,
    nextRank:isMaxed?null:next.name, progress:isMaxed?1:Math.min(1,(safeXp-cur.xp)/span),
    color:cur.color, glowColor:cur.glow, isMaxed:isMaxed, title:cur.title};
}

function cleanTtsText(text){
  return String(text||'').replace(/\[[^\]]*]/g,' ').replace(/\([^)]*\)/g,' ').replace(/\*[^*]*\*/g,' ').replace(/^\s*[A-Z][\w ' - -]{0,40}:\s*/gm,'').replace(/\s+/g,' ').trim();
}
function browserSpeakTts(text){
  if(!TTS_ON||!text||!('speechSynthesis' in window))return false;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(cleanTtsText(text));
    if(!u.text)return false;
    var gender=TALKNPC&&String(TALKNPC.gender||'').toLowerCase();
    var age=TALKNPC&&Number(TALKNPC.age||35);
    var isFemale=/\b(female|woman|girl)\b/.test(gender);
    var isMale=!isFemale&&/\b(male|man|boy)\b/.test(gender);
    var voices=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[];
    var preferred=voices.find(function(v){
      var n=String((v&&v.name)||'').toLowerCase();
      return isFemale?/female|woman|girl|zira|susan|hazel|samantha|victoria|karen|moira|tessa/.test(n):(isMale?/male|man|boy|david|mark|daniel|alex|fred|tom/.test(n):false);
    });
    if(preferred)u.voice=preferred;
    u.rate=0.95;
    u.pitch=isFemale ? 1.15 : (isMale ? .85 : 1);
    if(age>60)u.rate=.88;
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){console.warn('[tts fallback]',e);return false}
}
function primeTtsOutput(){
  if(!('speechSynthesis' in window))return;
  try{
    var u=new SpeechSynthesisUtterance(' ');
    u.volume=0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function stopTtsOutput(){
  if(TTS_AUDIO){try{TTS_AUDIO.pause();TTS_AUDIO.currentTime=0}catch(e){};TTS_AUDIO=null}
  if('speechSynthesis' in window)try{window.speechSynthesis.cancel()}catch(e){}
}

function addDialogueEffects(r){
  if(!TTS_ON||!TALKNPC)return;
  var text=(r.voice&&r.voice.text)||(r.dialogue?r.dialogue.reply:'');

  var reqId=++TTS_REQUEST_ID;
  stopTtsOutput();
  api('/api/tts',{method:'POST',timeoutMs:60000,body:JSON.stringify({text:text,npcId:TALKNPC.id,sessionId:S?S.id:''})}).then(function(d){
    if(!TTS_ON||reqId!==TTS_REQUEST_ID)return;

}

function communityTickerDiff(){

  var se=SD&&SD.session?SD.session:S,ns=se.npcStates||{},next={};

  W.npcs.forEach(function(n){
    var st=ns[n.id]||{},items=communityTickerSnapshot(n,st),snap={};
    items.forEach(function(item){snap[item.cat+'::'+item.field]=stableTickerValue(item.value)});
    next[n.id]=snap;
    if(initial)return;
    var prev=COMMUNITY_PREV[n.id]||{};
    items.forEach(function(item){
      var key=item.cat+'::'+item.field,fromVal=prev[key],toVal=snap[key];
      if(fromVal!==undefined&&fromVal!==toVal)communityTickerAdd(n,item.cat,item.field,fromVal,toVal);
      else if(fromVal===undefined&&toVal)communityTickerAdd(n,item.cat,item.field,'',toVal);
    });
    Object.keys(prev).forEach(function(key){
      if(snap[key]!==undefined)return;
      var bits=key.split('::'),meta=communityPanelMeta(bits[0]);
      communityTickerAdd(n,bits[0],bits[1]||meta.label,prev[key],'');
    });
  });
  COMMUNITY_PREV=next;
}

function connectChatWs(npcId){
  disconnectChatWs();

  var proto=location.protocol==='https:'?'wss:':'ws:';
  var url=proto+'//'+location.host;
  CHAT_WS=new WebSocket(url);

    CHAT_WS.send(JSON.stringify(Object.assign({type:'join',sessionId:S.id,playerName:S.playerName,npcId:npcId},activePlayerAuthPayload())));
  };
  CHAT_WS.onmessage=function(ev){
    try{
      var msg=JSON.parse(ev.data);
      if(msg.type==='chat'){
        var key=msg.sessionId+'_'+msg.timestamp;
        if(!SHARED_CONV_SEEN[key]){
          SHARED_CONV_SEEN[key]=true;
          CONVLINES.push({s:msg.playerName,t:msg.message,shared:true});
          if(msg.impossibleGift){
            CONVLINES.push({s:'gift',gift:msg.impossibleGift});
          }
          parseNpcReplySegments(msg.reply,msg.npcName).forEach(function(p){
            CONVLINES.push(p.kind==='action'?{s:'action',t:p.text,shared:true}:{s:msg.npcName,t:p.text,shared:true});
          });
          if(msg.npcState&&TALKNPC){
            var ns=msg.npcState;var il=ns.innerLife||{};
            // Update local NPC state so right panel reflects changes immediately
            var localSt=getNpcState(TALKNPC.id);
            if(ns.mood)localSt.mood=ns.mood;
            if(ns.relationship)localSt.relationship=ns.relationship;
            if(ns.totalInteractions)localSt.totalInteractions=ns.totalInteractions;
            if(!localSt.innerLife)localSt.innerLife={};
            if(il.lastThought)localSt.innerLife.lastThought=il.lastThought;
            if(il.affect){localSt.innerLife.affect=il.affect}
            if(il.pepActive!==undefined){localSt.innerLife.pepActive=il.pepActive;localSt.innerLife.pepTarget=il.pepTarget;localSt.innerLife.pepCycleCount=il.pepCycleCount}
            if(il.intentions)localSt.innerLife.intentions=il.intentions;
            if(il.theoryOfPlayer)localSt.innerLife.theoryOfPlayer=il.theoryOfPlayer;
            if(il.defenses)localSt.innerLife.defenses=il.defenses;
            if(ns.memories&&ns.memories.length){localSt.memories=localSt.memories||[];ns.memories.forEach(function(m){localSt.memories.push(m)})}
          }
          renderConvModal();
        }
      }else if(msg.type==='player_joined'){
        CHAT_WS_ROOM_PLAYERS[msg.sessionId]={playerName:msg.playerName,sessionId:msg.sessionId};
        CONVLINES.push({s:'narr',t:msg.playerName+' entered the room.'});
        renderConvModal();
      }else if(msg.type==='player_left'){
        delete CHAT_WS_ROOM_PLAYERS[msg.sessionId];
        CONVLINES.push({s:'narr',t:msg.playerName+' left.'});
        renderConvModal();
      }else if(msg.type==='room_state'){
        CHAT_WS_ROOM_PLAYERS={};
        (msg.participants||[]).forEach(function(p){CHAT_WS_ROOM_PLAYERS[p.sessionId]={playerName:p.playerName,sessionId:p.sessionId}});
      }
    }catch(e){}
  };
  CHAT_WS.onclose=function(){CHAT_WS=null;if(TALKNPC&&S){setTimeout(function(){if(TALKNPC&&S&&!CHAT_WS)connectChatWs(TALKNPC.id)},2000)}};
}

  disconnectCoopWs();

    var payload=Object.assign({type:'coop_register',sessionId:S.id},activePlayerAuthPayload());

  };
  COOP_WS.onmessage=function(ev){
    try{var msg=JSON.parse(ev.data)}catch(e){return}
    if(msg.type==='quest_step_complete'){
      var q=activeWorldQuest();

        var step=(q.steps||[]).find(function(s){return s.id===msg.stepId});
        if(step){step.status='complete';step.completedAt=new Date().toISOString()}
      }
      addFeed('quest','Partner completed: '+(msg.stepTitle||'quest step'));
      playWorldQuestStepCompleteSound();
      render();
    }else if(msg.type==='coop_player_joined'){
      addFeed('quest','2P partner joined: '+(msg.guestName||'player'));
      refresh(function(){connectCoopWs();render()});
    }else if(msg.type==='coop_player_left'){
      addFeed('quest','2P partner left the quest');
      refresh(function(){render()});
    }else if(msg.type==='coop_mode_change'){
      addFeed('quest','Partner switched to '+msg.mode+' mode');
      refresh(function(){render()});
    }else if(msg.type==='world_quest_join_request'){
      CONV_QUEST_MINIMIZED=false;
      addFeed('quest',(msg.playerName||'A player')+' wants to join the World Quest');
      refresh(function(){render();if(TALKNPC)renderConvModal()});
    }else if(msg.type==='world_quest_join_accepted'){
      if(S&&msg.locationId){S.currentLocationId=msg.locationId;if(SD&&SD.session)SD.session.currentLocationId=msg.locationId}
      addFeed('quest','World Quest join accepted');
      refresh(function(){connectCoopWs();render();if(TALKNPC)renderConvModal()});
    }else if(msg.type==='world_quest_join_declined'){
      addFeed('quest','World Quest join refused');

      addFeed('quest',(msg.playerName||'A player')+' wants to join the Adventure');
      refresh(function(){render();if(TALKNPC)renderConvModal()});
    }else if(msg.type==='serialized_adventure_join_accepted'){
      if(S&&msg.locationId){S.currentLocationId=msg.locationId;if(SD&&SD.session)SD.session.currentLocationId=msg.locationId}
      addFeed('quest','Adventure join accepted');
      refresh(function(){connectCoopWs();render();if(TALKNPC)renderConvModal()});
    }else if(msg.type==='serialized_adventure_join_declined'){
      addFeed('quest','Adventure join refused');
      refresh(function(){render();if(TALKNPC)renderConvModal()});
    }else if(msg.type==='coop_location_sync'){
      if(S)S.currentLocationId=msg.locationId;
      if(SD&&SD.session)SD.session.currentLocationId=msg.locationId;
      if(VIEW==='portal')triggerPortalMoveStatic();
      addFeed('move','Followed co-op partner');
      refresh(function(){render()});
    }else if(msg.type==='quest_completed'){
      addFeed('quest','World Quest '+(msg.status==='completed'?'completed':'ended'));
      refresh(function(){render()});
    }else if(msg.type==='direct_character_message'){
      var from=msg.fromName||'Another character';
      var text=String(msg.message||'');
      portalLog('Message',from+': '+text);
      addFeed('npc_talk',from+' tells you: '+text);
      showDirectMessageToast(from,text);
      if(VIEW==='portal')renderCenter();
    }else if(msg.type==='portal_echo'){

      if(PORTAL_PLAYER_RIPPLES.length>30)PORTAL_PLAYER_RIPPLES=PORTAL_PLAYER_RIPPLES.slice(-30);
      if(VIEW==='portal')renderCenter();

      }
    }
  };
  COOP_WS.onclose=function(){COOP_WS=null;if(S){setTimeout(function(){if(S&&!COOP_WS)connectCoopWs()},3000)}};
}

function sendMsg(msg,kind,declaredIntent){
  if(!TALKNPC||!msg)return;
  kind=kind||'speech';
  if(msg!=='hello')CONVLINES.push(kind==='speech'?{s:'player',t:msg}:{s:'action',t:formatAction(msg)});
  addFeed(kind==='speech'?'npc_talk':'action',(kind==='speech'?'? '+TALKNPC.name+': '+msg.slice(0,40):formatAction(msg)));

  // Show typing indicator
  var msgs=document.getElementById('conv-msgs');
  if(msgs)msgs.innerHTML+='<div class="msg narr typing-indicator" id="typing"><span>'+esc(TALKNPC.name)+' is thinking</span><span class="typing-dots"><span></span><span></span><span></span></span></div>';
  if(msgs)msgs.scrollTop=msgs.scrollHeight;

  api('/api/sessions/'+S.id+'/talk',{method:'POST',body:llmBody(talkPayload(msg,kind,declaredIntent))}).then(function(r){
    var typ=document.getElementById('typing');if(typ)typ.remove();
    if(r.error){CONVLINES.push({s:'narr',t:'('+r.error+')'});renderConvModal();return}
    if(r.session){S=r.session;if(SD)SD.session=r.session}
    if(Array.isArray(r.dramaLeads))DRAMA_LEADS=r.dramaLeads;
    var reply=r.dialogue?r.dialogue.reply:'(silence)';
    if(r.impossibleGift)CONVLINES.push({s:'gift',gift:r.impossibleGift});
    pushNpcReplyLines(TALKNPC.name,reply);
    if(r.consequences&&r.consequences.length)CONVLINES.push({s:'consequence',items:r.consequences});
    showQuestUpdates(r);
    if(window.AudioManager)AudioManager.play('state.conv.reply');
    addDialogueEffects(r);
    addFeed('npc_talk',TALKNPC.name+': '+reply.slice(0,50));
    // Refresh session to get updated inner state
    refresh(function(){renderConvModal();renderLeft()});
    setTimeout(function(){
      if(TALKNPC&&S)refresh(function(){renderConvModal();renderLeft();renderCenter()});
    },1400);
    setTimeout(function(){
      if(TALKNPC&&S)refresh(function(){renderConvModal();renderLeft();renderCenter()});
    },3200);
  }).catch(function(e){
    var typ=document.getElementById('typing');if(typ)typ.remove();
    CONVLINES.push({s:'narr',t:'(failed: '+e+')'});renderConvModal();
  });
}

  var npcId=qs.get('focusNpc')||'';
  var locId=qs.get('focusLoc')||'';
  var npc=npcId&&W&&W.npcs?W.npcs.find(function(n){return n.id===npcId}):null;
  var loc=locId&&W&&W.locations?W.locations.find(function(l){return l.id===locId}):null;

  el.innerHTML='<div class="quest-start-kicker">Quest Started</div><div class="quest-start-title">'+esc(title)+'</div><div class="quest-start-msg">'+esc([npc&&npc.name?('Find '+npc.name):'',loc&&loc.name?('at '+loc.name):''].filter(Boolean).join(' ')||'Follow the first clue.')+'</div>';
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},5200);
  if(npc){SELNPC=npc;VIEW='detail';DTAB='psych';}
  setTimeout(function(){

function startSession(sessionId){
  A.innerHTML='<div style="padding:40px;color:#94a3b8">Loading session...</div>';
  api('/api/config/public').then(function(c){POLL_TOKEN=c.pollinationsToken||''}).catch(function(){});
  var loaded=false;
  function loadSession(){
    if(loaded)return;
    loaded=true;
    api('/api/sessions/'+encodeURIComponent(sessionId)+'/full').then(function(sd){
      applySessionData(sd);
      VIEW='portal';
      render();
      maybeShowQuestStartFocus();
      maybeRunInitialEntryTick();
      if(window.AudioManager&&SD){
        if(SD.location){var _se=SD.session||S;applySceneAudio(SD.location,_se&&_se.currentWeather,currentSceneSoundscape())}
        syncWorldMusic();
      }
      startAutoRefresh();
    }).catch(function(e){
      if(e&&e.status===403&&window.parent&&window.parent!==window){
        window.parent.postMessage({type:'worldgen:session-forbidden',sessionId:sessionId,message:e.message||String(e)},window.location.origin);
      }
      A.innerHTML='<div style="padding:40px;color:#ef4444">Cannot load session: '+esc(e)+'</div>';
    });
  }
  loadSession();
  refreshProviderAvailability(function(){if(W&&S)render()});
}

// Enter an existing saved world: resume the latest session if one exists, otherwise create a new one.
function enterWorld(worldId){
var pn=(document.getElementById('pname')||{}).value||'Stranger';
api('/api/worlds/'+worldId).then(function(d){
  if(d.error){alert(d.error);return}
  W=d.world;DISPLAY_LANG=W.displayLanguage||'';
  return api('/api/worlds/'+worldId+'/sessions').then(function(sl){
    var existing=(sl.sessions||[]).slice().sort(function(a,b){return (b.dayCount||0)-(a.dayCount||0)})[0];
    if(existing){
      S={id:existing.id,worldId:worldId,playerName:existing.playerName};
      return api('/api/sessions/'+existing.id+'/full').then(function(sd){applySessionData(sd);VIEW='portal';render();maybeRunInitialEntryTick()});
    }
    return api('/api/worlds/'+worldId+'/sessions',{method:'POST',body:JSON.stringify({playerName:pn})}).then(function(s){
      if(s.error){alert(s.error);return}
      S=s.session;
      return api('/api/sessions/'+S.id+'/full').then(function(sd){applySessionData(sd);VIEW='portal';render();maybeRunInitialEntryTick()});
    });
  });
}).catch(function(e){alert('Failed to enter world: '+e)});
}

function calcPopularity(){
  if(!W||!S)return 50;
  var se=SD?SD.session:S;var ns=se.npcStates||{};
  var total=0,count=0;
  W.npcs.forEach(function(n){
    var st=ns[n.id];if(!st||!st.totalInteractions)return;
    count++;
    var trust=st.trustLevel||50;
    var warmth=st.warmth||50;
    var relScore=({hostile:0,wary:15,stranger:35,face:40,nodding:45,acquaintance:50,friendly:60,friend:72,close_friend:85,intimate:95})[st.relationship]||40;
    var affectBonus=0;
    if(st.innerLife&&st.innerLife.affect){
      var af=st.innerLife.affect;
      affectBonus+=(af.trust||0)*15;affectBonus+=(af.joy||0)*10;affectBonus+=(af.gratitude||0)*12;affectBonus+=(af.tenderness||0)*8;
      affectBonus-=(af.anger||0)*15;affectBonus-=(af.contempt||0)*20;affectBonus-=(af.resentment||0)*18;affectBonus-=(af.fear||0)*8;affectBonus-=(af.disgust||0)*12;
    }
    var score=(trust*0.3)+(warmth*0.3)+(relScore*0.3)+(affectBonus*0.1);
    total+=Math.max(0,Math.min(100,score));
  });
  if(!count)return 50;
  return Math.round(total/count);
}

function toggleLeftPanelSwap(){
var left=document.getElementById('leftpanel');
var loc=left&&document.getElementById('left-locations-panel');
var people=left&&document.getElementById('left-people-panel');
if(left&&loc&&people){
var firstRects={
  loc:loc.getBoundingClientRect(),
  people:people.getBoundingClientRect()
};
LEFT_PANEL_SWAP=!LEFT_PANEL_SWAP;
try{localStorage.setItem('worldgen:leftPanelSwap',LEFT_PANEL_SWAP?'1':'0')}catch(e){}
if(LEFT_PANEL_SWAP){left.insertBefore(people,loc)}else{left.insertBefore(loc,people)}
Array.prototype.forEach.call(left.querySelectorAll('.panel-swap-btn'),function(btn){btn.classList.toggle('on',LEFT_PANEL_SWAP)});
var lastRects={
  loc:loc.getBoundingClientRect(),
  people:people.getBoundingClientRect()
};
[
  {el:loc,from:firstRects.loc,to:lastRects.loc},
  {el:people,from:firstRects.people,to:lastRects.people}
].forEach(function(item){
  var dy=item.from.top-item.to.top;
  item.el.style.position='relative';
  item.el.style.zIndex='2';
  item.el.style.transition='none';
  item.el.style.transform='translateY('+dy+'px)';
});
requestAnimationFrame(function(){
  [loc,people].forEach(function(el){
    el.style.transition='transform .34s cubic-bezier(.22,1,.36,1)';
    el.style.transform='translateY(0)';
  });
  window.setTimeout(function(){
    [loc,people].forEach(function(el){
      el.style.transition='';
      el.style.transform='';
      el.style.position='';
      el.style.zIndex='';
    });
  },360);
  });
return;
}
renderLeft();
}

// Dossier window auto-scroll. The selected psyche button's content renders into a
// single centered window (#dtab-window); this gently auto-scrolls it top→bottom,
// dwells at each end, then loops. Pauses on user interaction (wheel/touch/click)
// for a few seconds so they can read. Restarts from the top on every tab switch.
function dossierScrollInit(){
  var el=document.getElementById('dtab-window');if(!el)return;
  DOSSIER_POS=0;el.scrollTop=0;DOSSIER_PHASE='holdTop';DOSSIER_HOLD=60;DOSSIER_PAUSED=false;el.classList.remove('paused');
  el.addEventListener('wheel',dossierScrollPause,{passive:true});
  el.addEventListener('touchstart',dossierScrollPause,{passive:true});
  el.addEventListener('mousedown',dossierScrollPause);
  dossierScrollStart();
}
function dossierScrollStart(){
  if(DOSSIER_RAF)cancelAnimationFrame(DOSSIER_RAF);
  if(MOBILE_DEVICE){DOSSIER_RAF=null;return}
  function tick(){
    var el=document.getElementById('dtab-window');
    if(!el){DOSSIER_RAF=null;return}
    if(DOSSIER_PAUSED){DOSSIER_RAF=requestAnimationFrame(tick);return}
    var maxScroll=el.scrollHeight-el.clientHeight;
    if(maxScroll<=2){el.scrollTop=0;DOSSIER_RAF=requestAnimationFrame(tick);return}
    if(DOSSIER_PHASE==='holdTop'){if(--DOSSIER_HOLD<=0)DOSSIER_PHASE='scroll';}
    else if(DOSSIER_PHASE==='holdBottom'){if(--DOSSIER_HOLD<=0){DOSSIER_POS=0;el.scrollTop=0;DOSSIER_PHASE='holdTop';DOSSIER_HOLD=60;}}
    else{DOSSIER_POS+=0.3;if(DOSSIER_POS>=maxScroll){DOSSIER_POS=maxScroll;el.scrollTop=maxScroll;DOSSIER_PHASE='holdBottom';DOSSIER_HOLD=120;}else el.scrollTop=DOSSIER_POS;}
    DOSSIER_RAF=requestAnimationFrame(tick);
  }
  DOSSIER_RAF=requestAnimationFrame(tick);
}
function dossierScrollPause(){
  DOSSIER_PAUSED=true;
  var el=document.getElementById('dtab-window');if(el)el.classList.add('paused');
  if(DOSSIER_TIMER)clearTimeout(DOSSIER_TIMER);
  DOSSIER_TIMER=setTimeout(dossierScrollResume,4000);
}
function dossierScrollResume(){
  DOSSIER_PAUSED=false;
  var el=document.getElementById('dtab-window');
  if(el){el.classList.remove('paused');DOSSIER_POS=el.scrollTop;DOSSIER_PHASE='scroll';DOSSIER_HOLD=0;}
}

// Custom NPC portrait upload. Triggers a hidden file picker, reads the chosen
// image as base64, POSTs to /api/worlds/<wid>/npc/<npcId>/portrait. Server marks
// the portrait kind:'manual' which makes it sacrosanct - AI image gen + cast-rematch
// will never overwrite it. Used to attach real film stills to canonical characters
// (Pinhead, Frank, Larry etc.) instead of TMDB actor headshots or AI generations.
function uploadNpcPortrait(npcId){
  if(!W||!W.id){alert('No world loaded');return;}
  var npc=(W.npcs||[]).find(function(n){return n.id===npcId});
  if(!npc){alert('NPC not found: '+npcId);return;}
  var inp=document.getElementById('manual-portrait-file');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file';
    inp.id='manual-portrait-file';
    inp.accept='image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp';
    inp.style.display='none';
    document.body.appendChild(inp);
  }
  inp.onchange=function(ev){
    var f=ev.target.files&&ev.target.files[0];
    inp.value='';
    if(!f)return;
    if(f.size>12*1024*1024){alert('Image too large (max 12MB). Selected: '+(f.size/1024/1024).toFixed(1)+'MB');return;}
    if(!/\.(jpg|jpeg|png|webp)$/i.test(f.name||'')){alert('Use JPG/PNG/WebP only.');return;}
    // Visual feedback - replace button with "Uploading..." while we work
    var btns=document.querySelectorAll('[data-portrait-upload-btn="'+npcId+'"]');
    btns.forEach(function(b){b.disabled=true;b.textContent='Uploading...';});
    var fr=new FileReader();
    fr.onerror=function(){alert('Could not read file');btns.forEach(function(b){b.disabled=false;b.textContent='📷 Upload';});};
    fr.onload=function(){
      var b64=String(fr.result).replace(/^data:[^,]*,/,'');
      // Portrait upload is an admin action: reuse the admin key the hub stored (same origin).
      var uploadHeaders={'Content-Type':'application/json'};
      try{var adminKey=localStorage.getItem('worldgen:apiKey');if(adminKey)uploadHeaders['x-api-key']=adminKey;}catch(e){}
      fetch('/api/worlds/'+encodeURIComponent(W.id)+'/npc/'+encodeURIComponent(npcId)+'/portrait',{
        method:'POST',
        headers:uploadHeaders,
        body:JSON.stringify({filename:f.name||'portrait.jpg',dataBase64:b64})
      }).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});}).then(function(res){
        btns.forEach(function(b){b.disabled=false;b.textContent='📷 Upload';});
        if(!res.ok){alert('Upload failed: '+(res.d.detail||res.d.error||'server error'));return;}
        // Patch in-memory world so the dossier shows the new image immediately
        W.images=W.images||{};
        W.images.portraits=W.images.portraits||{};
        W.images.portraitSources=W.images.portraitSources||{};
        W.images.portraits[npcId]=res.d.url;
        W.images.portraitSources[npcId]={kind:'manual',uploadedAt:new Date().toISOString()};
        var npcObj=(W.npcs||[]).find(function(n){return n.id===npcId});
        if(npcObj){npcObj.images=npcObj.images||{};npcObj.images.portrait=res.d.url;}
        // Bust the image cache for this NPC so the new image actually shows

function searchText(v,depth){
  if(v===undefined||v===null)return '';
  if(depth===undefined)depth=0;
  if(depth>4)return '';
  if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return String(v);
  if(Array.isArray(v))return v.map(function(x){return searchText(x,depth+1)}).filter(Boolean).join(' ');
  if(typeof v==='object')return Object.keys(v).map(function(k){return k+' '+searchText(v[k],depth+1)}).filter(Boolean).join(' ');
  return '';
}
function searchPreview(v){
  var s=searchText(v).replace(/\s+/g,' ').trim();
  if(s.length>180)s=s.slice(0,177)+'...';

}

function scoreSearchDoc(doc,q,tokens){
  var hay=(doc.type+' '+doc.title+' '+doc.field+' '+doc.text).toLowerCase();
  if(!hay)return 0;
  var score=0;
  if(hay.indexOf(q)>=0)score+=45;
  tokens.forEach(function(t){if(!t)return;if(hay.indexOf(t)>=0)score+=10;if((doc.title||'').toLowerCase().indexOf(t)>=0)score+=8;if((doc.field||'').toLowerCase().indexOf(t)>=0)score+=6});
  return score*(doc.weight||1);
}

}

function postTickEvent(active){if(window.parent&&window.parent!==window)window.parent.postMessage({type:'worldgen:tick',active:active,at:Date.now()},window.location.origin)}
function postHeartbeatBoost(mode,duration){if(window.parent&&window.parent!==window)window.parent.postMessage({type:'worldgen:heartbeat',mode:mode,at:Date.now(),duration:duration},window.location.origin)}
function doTick(){TICK_ACTIVE=true;TICK_TIMES.push(Date.now());hbAnimate();postTickEvent(true);postHeartbeatBoost('tick',6000);if(window.AudioManager)AudioManager.play('state.tick.start');addFeed('decide','Running tick...');
api('/api/sessions/'+S.id+'/tick',{method:'POST',body:llmBody()}).then(function(r){
TICK_ACTIVE=false;hbAnimate();postTickEvent(false);if(window.AudioManager)AudioManager.play('state.tick.end');
if(Array.isArray(r.dramaLeads))DRAMA_LEADS=r.dramaLeads;
if(r.recap&&r.recap.bullets)r.recap.bullets.slice(0,3).forEach(function(b){addFeed('event',b)});
if(r.events)r.events.forEach(function(e){addFeed('event',e.npc+': '+e.event)});
if(r.thoughts)r.thoughts.forEach(function(t){addFeed('thought',t.npc+': '+t.thought)});
if(r.conversations)r.conversations.forEach(function(c){if(c.fragment)addFeed('npc_talk',c.a+' & '+c.b+': "'+c.fragment+'"')});
if(r.gossip)r.gossip.forEach(function(g){addFeed('gossip',g.npc+': '+g.content)});
if(r.pep)r.pep.forEach(function(p){addFeed('pep',p.npc+': '+p.detail)});
if(r.defenses)r.defenses.forEach(function(d){addFeed('defense',d.npc+': '+d.defense+'  -  '+d.behaviour)});
addFeed('decide','Tick: '+(r.ticks||0)+' social, '+(r.cognitive||0)+' cognitive');
showQuestUpdates(r);
refresh(function(){render()})
}).catch(function(e){TICK_ACTIVE=false;hbAnimate();postTickEvent(false);addFeed('error','Tick failed: '+e)})}

function maybeRunInitialEntryTick(){
if(!S||TICK_ACTIVE||F.length)return;
var key='worldgen:initialEntryTick:'+S.id;
try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch(e){}
setTimeout(function(){if(S&&!F.length&&!TICK_ACTIVE)doTick()},350);
}

function doWait(hrs){postHeartbeatBoost(hrs>=6?'wait6':'wait1',hrs>=6?9000:7000);if(window.AudioManager)AudioManager.play('state.wait');addFeed('event','Advancing '+hrs+'h...');
api('/api/sessions/'+S.id+'/wait',{method:'POST',body:llmBody({hours:hrs})}).then(function(r){
if(r.error){addFeed('error',r.error);return}
if(r.session){S=r.session;if(SD)SD.session=r.session}
if(Array.isArray(r.dramaLeads))DRAMA_LEADS=r.dramaLeads;
if(r.recap&&r.recap.bullets)r.recap.bullets.slice(0,3).forEach(function(b){addFeed('event',b)});
if(window.AudioManager&&SD&&SD.location)applySceneAudio(SD.location,(r&&r.weather)||(r&&r.session&&r.session.currentWeather)||(SD.session&&SD.session.currentWeather),r.soundscape);
handleWeatherAudio(r,'Weather');
var waitEcho=hrs+'h -> '+(r.timeOfDay||'')+' '+clockTime(r.currentTime,r.currentMinute);
portalLog('Time',waitEcho);
addFeed('event',waitEcho);showQuestUpdates(r);render();refresh(function(){render()})
}).catch(function(e){addFeed('error','Wait failed: '+e)})}

init();
</script>
</body>
</html>
